<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大同古建漫游 · 副本通关</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

  <div class="ending-stage" id="endingStage">
    <div class="ending-panorama" id="panorama"></div>
    <div class="ending-vignette" id="vignette"></div>
    <div class="ending-title" id="endingTitle">大同古建 · 记忆重聚</div>
    <!-- 六块碎片由 ending.js 生成并飞入汇聚 -->
    <div class="ending-panel" id="endingPanel">
      <div class="seal-line">六碎片齐聚 · 大同古建全景点亮</div>
      <div class="ending-actions">
        <button class="btn btn-gold" onclick="location.href='index.html'">返回首页地图</button>
        <button class="btn btn-gold" onclick="location.href='museum.html'">碎片博物馆</button>
        <button class="btn btn-red" id="btnReset">重新开始副本</button>
      </div>
    </div>
  </div>

  <!-- 重置确认弹窗 -->
  <div class="modal-mask" id="resetModal">
    <div class="modal-panel" style="width:min(420px,90vw);text-align:center">
      <div class="modal-title" style="justify-content:center">重新开始副本？</div>
      <p style="margin:8px 0 18px">将清空全部闯关进度与碎片收集记录，此操作无法撤销。</p>
      <div style="display:flex;gap:12px;justify-content:center">
        <button class="btn btn-red" id="resetYes">确认重置</button>
        <button class="btn btn-ghost" id="resetNo">再想想</button>
      </div>
    </div>
  </div>

  <script src="lib/three.min.js"></script>
  <script src="js/data.js?v=5"></script>
  <script src="js/progress.js?v=5"></script>
  <script src="js/npc.js?v=5"></script>
  <script src="js/buildings.js?v=5"></script>
  <script src="js/ending.js?v=5"></script>
</body>
</html>
