<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山西大同善化寺 · 三维交互模型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #1a1410;
    font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    overflow: hidden;
    color: #e8dcc8;
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  #canvas-container {
    width: 100%;
    height: 100%;
  }

  canvas { display: block; }

  /* ── 加载动画 ── */
  #loader {
    position: fixed; inset: 0;
    background: #1a1410;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 1000;
    transition: opacity 0.8s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  
  .loader-ring {
    width: 64px; height: 64px;
    border: 3px solid rgba(212,175,110,0.2);
    border-top-color: #d4af6e;
    border-radius: 50%;
    animation: spin 1.2s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .loader-text {
    font-size: 18px;
    color: #d4af6e;
    letter-spacing: 6px;
    font-weight: 300;
  }
  .loader-sub {
    font-size: 12px;
    color: #8a7a60;
    margin-top: 8px;
    letter-spacing: 2px;
  }

  /* ── 顶部标题栏 ── */
  #top-bar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 64px;
    background: linear-gradient(180deg, rgba(26,20,16,0.92), rgba(26,20,16,0.6));
    backdrop-filter: blur(8px);
    display: flex; align-items: center;
    padding: 0 24px;
    z-index: 100;
    border-bottom: 1px solid rgba(212,175,110,0.15);
  }
  .title-main {
    font-size: 22px;
    color: #e8dcc8;
    font-weight: 600;
    letter-spacing: 3px;
  }
  .title-sub {
    font-size: 13px;
    color: #8a7a60;
    margin-left: 12px;
    letter-spacing: 1px;
    border-left: 1px solid rgba(212,175,110,0.3);
    padding-left: 12px;
  }
  .top-badge {
    margin-left: auto;
    background: rgba(212,175,110,0.12);
    border: 1px solid rgba(212,175,110,0.3);
    border-radius: 4px;
    padding: 4px 12px;
    font-size: 12px;
    color: #d4af6e;
    letter-spacing: 1px;
  }

  /* ── 右侧按钮组 ── */
  #controls {
    position: fixed;
    right: 24px; top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column;
    gap: 12px;
    z-index: 100;
  }
  .ctrl-btn {
    width: 48px; height: 48px;
    border-radius: 10px;
    background: rgba(40,30,22,0.85);
    border: 1px solid rgba(212,175,110,0.25);
    color: #d4af6e;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s ease;
    backdrop-filter: blur(8px);
    font-size: 20px;
    position: relative;
  }
  .ctrl-btn:hover {
    background: rgba(60,45,30,0.9);
    border-color: rgba(212,175,110,0.6);
    transform: translateX(-3px);
    box-shadow: 0 4px 16px rgba(212,175,110,0.15);
  }
  .ctrl-btn.active {
    background: rgba(80,55,30,0.9);
    border-color: rgba(212,175,110,0.7);
    color: #f0d490;
  }
  .ctrl-btn .tooltip {
    position: absolute;
    right: 56px;
    white-space: nowrap;
    background: rgba(40,30,22,0.95);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    color: #e8dcc8;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    border: 1px solid rgba(212,175,110,0.2);
  }
  .ctrl-btn:hover .tooltip { opacity: 1; }

  /* ── 底部图层选择器 ── */
  #layer-selector {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(0deg, rgba(26,20,16,0.92), rgba(26,20,16,0.5));
    backdrop-filter: blur(8px);
    padding: 16px 24px;
    z-index: 100;
    border-top: 1px solid rgba(212,175,110,0.15);
    display: flex; align-items: center; gap: 16px;
    overflow-x: auto;
  }
  .layer-label {
    font-size: 13px; color: #8a7a60;
    white-space: nowrap;
    letter-spacing: 2px;
  }
  .layer-items {
    display: flex; gap: 8px;
    flex-wrap: wrap;
  }
  .layer-item {
    padding: 8px 16px;
    background: rgba(40,30,22,0.6);
    border: 1px solid rgba(212,175,110,0.2);
    border-radius: 6px;
    color: #c8b898;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.25s ease;
    letter-spacing: 1px;
  }
  .layer-item:hover {
    background: rgba(60,45,30,0.8);
    border-color: rgba(212,175,110,0.5);
    color: #f0d490;
  }
  .layer-item.active {
    background: rgba(80,55,30,0.85);
    border-color: rgba(212,175,110,0.7);
    color: #f0d490;
    box-shadow: 0 2px 12px rgba(212,175,110,0.15);
  }

  /* ── 悬停tooltip ── */
  #hover-tooltip {
    position: fixed;
    background: rgba(40,30,22,0.95);
    border: 1px solid rgba(212,175,110,0.4);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    color: #e8dcc8;
    pointer-events: none;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.15s ease;
    backdrop-filter: blur(8px);
    max-width: 240px;
  }
  #hover-tooltip.visible { opacity: 1; }
  .tooltip-name { font-size: 14px; color: #f0d490; font-weight: 600; }
  .tooltip-era { font-size: 11px; color: #8a7a60; margin-top: 2px; }

  /* ── 信息面板 ── */
  #info-panel {
    position: fixed;
    top: 80px; right: 24px;
    width: 380px;
    max-height: calc(100vh - 200px);
    background: rgba(34,26,20,0.95);
    border: 1px solid rgba(212,175,110,0.25);
    border-radius: 12px;
    backdrop-filter: blur(12px);
    z-index: 150;
    overflow-y: auto;
    transform: translateX(420px);
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #info-panel.visible { transform: translateX(0); }
  
  .panel-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid rgba(212,175,110,0.15);
    display: flex; align-items: flex-start;
    gap: 12px;
  }
  .panel-icon {
    width: 40px; height: 40px;
    border-radius: 8px;
    background: rgba(212,175,110,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .panel-titles { flex: 1; }
  .panel-name {
    font-size: 20px; color: #f0d490;
    font-weight: 600;
    letter-spacing: 2px;
  }
  .panel-era {
    font-size: 12px; color: #8a7a60;
    margin-top: 4px;
    letter-spacing: 1px;
  }
  .panel-close {
    width: 28px; height: 28px;
    border: none; background: none;
    color: #8a7a60; font-size: 20px;
    cursor: pointer;
    transition: color 0.2s;
  }
  .panel-close:hover { color: #f0d490; }
  
  .panel-body { padding: 20px 24px; }
  .panel-section { margin-bottom: 20px; }
  .panel-section:last-child { margin-bottom: 0; }
  
  .section-title {
    font-size: 12px;
    color: #d4af6e;
    letter-spacing: 3px;
    margin-bottom: 8px;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(212,175,110,0.1);
    padding-bottom: 6px;
  }
  .section-text {
    font-size: 14px;
    line-height: 1.8;
    color: #c8b898;
  }
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .info-cell {
    background: rgba(40,30,22,0.5);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .info-cell-label { font-size: 11px; color: #8a7a60; }
  .info-cell-value { font-size: 14px; color: #e8dcc8; margin-top: 2px; }

  /* ── 滚动条 ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(212,175,110,0.25);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(212,175,110,0.4); }

  /* ── 响应式 ── */
  @media (max-width: 768px) {
    #info-panel { width: calc(100vw - 32px); right: 16px; }
    .title-sub { display: none; }
    #controls { right: 12px; }
    .ctrl-btn { width: 40px; height: 40px; font-size: 16px; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="canvas-container"></div>

  <!-- 加载动画 -->
  <div id="loader">
    <div class="loader-ring"></div>
    <div class="loader-text">善化寺</div>
    <div class="loader-sub">辽金古刹 · 三维重建</div>
  </div>

  <!-- 顶部标题栏 -->
  <div id="top-bar">
    <span class="title-main">善化寺</span>
    <span class="title-sub">山西大同 · 辽金建筑群 · 全国重点文物保护单位</span>
    <span class="top-badge">第一批国保</span>
  </div>

  <!-- 控制按钮 -->
  <div id="controls">
    <button class="ctrl-btn" id="btn-rotate" title="自动旋转">
      <span>🔄</span>
      <span class="tooltip">自动旋转</span>
    </button>
    <button class="ctrl-btn" id="btn-explode" title="拆解视图">
      <span>explode</span>
      <span class="tooltip">拆解视图</span>
    </button>
    <button class="ctrl-btn" id="btn-reset" title="重置视角">
      <span>⌂</span>
      <span class="tooltip">重置视角</span>
    </button>

  <!-- 信息面板 -->
  <div id="info-panel">

      <div class="panel-icon" id="panel-icon">🏛</div>

    <div class="panel-body" id="panel-body"></div>

  <!-- 悬停tooltip -->
  <div id="hover-tooltip">

    <div class="tooltip-era" id="tooltip-era"></div>
  </div>

  <!-- 底部图层选择器 -->
  <div id="layer-selector">
    <span class="layer-label">建筑部位</span>
    <div class="layer-items" id="layer-items"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ════════════════════════════════════════
//  场景初始化
// ════════════════════════════════════════
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1410);
scene.fog = new THREE.Fog(0x1a1410, 60, 180);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
const defaultCamPos = new THREE.Vector3(55, 35, 55);
camera.position.copy(defaultCamPos);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 20;
controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.target.set(0, 5, 0);

// ════════════════════════════════════════
//  光照
// ════════════════════════════════════════
const ambient = new THREE.AmbientLight(0xfff0d4, 0.45);
scene.add(ambient);

const sunLight = new THREE.DirectionalLight(0xffd8a0, 1.2);
sunLight.position.set(30, 50, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -60;
sunLight.shadow.camera.right = 60;
sunLight.shadow.camera.top = 60;
sunLight.shadow.camera.bottom = -60;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 150;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0xa0c0ff, 0.3);
fillLight.position.set(-20, 30, -20);
scene.add(fillLight);

const hemiLight = new THREE.HemisphereLight(0xd4af6e, 0x2a1f15, 0.35);
scene.add(hemiLight);

// ════════════════════════════════════════
//  材质库
// ════════════════════════════════════════
const mat = {
  roof: new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 0.7, metalness: 0.05 }),
  roofDark: new THREE.MeshStandardMaterial({ color: 0x4a2d1a, roughness: 0.75, metalness: 0.05 }),
  wall: new THREE.MeshStandardMaterial({ color: 0xc4a878, roughness: 0.85, metalness: 0.02 }),
  wallDark: new THREE.MeshStandardMaterial({ color: 0xa08858, roughness: 0.85, metalness: 0.02 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x8b5e3c, roughness: 0.65, metalness: 0.05 }),
  woodDark: new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.7, metalness: 0.05 }),
  pillar: new THREE.MeshStandardMaterial({ color: 0x9d5c30, roughness: 0.6, metalness: 0.05 }),
  stone: new THREE.MeshStandardMaterial({ color: 0x9a9088, roughness: 0.9, metalness: 0.01 }),
  ground: new THREE.MeshStandardMaterial({ color: 0x4a3c2e, roughness: 0.95, metalness: 0.01 }),
  tile: new THREE.MeshStandardMaterial({ color: 0x5a6b55, roughness: 0.8, metalness: 0.03 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xc8a050, roughness: 0.3, metalness: 0.6 }),
  statue: new THREE.MeshStandardMaterial({ color: 0xc89858, roughness: 0.5, metalness: 0.15 }),
  highlight: new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.8, emissive: 0x886600, emissiveIntensity: 0.3 }),
};

// 保存原始材质
const origMat = {};
for (const k in mat) origMat[k] = mat[k].clone();

// ════════════════════════════════════════
//  建筑构建函数
// ════════════════════════════════════════

// 创建庑殿顶屋顶
function createRoof(width, depth, height, style = 'wudian') {
  const group = new THREE.Group();
  
  if (style === 'wudian') {
    // 庑殿顶 - 四面斜坡
    // 主屋脊
    const ridgeGeom = new THREE.BoxGeometry(width * 0.7, 0.4, 0.5);
    const ridge = new THREE.Mesh(ridgeGeom, mat.roofDark);
    ridge.position.set(0, height, -depth * 0.15);
    ridge.castShadow = true;
    ridge.receiveShadow = true;
    group.add(ridge);

    // 前坡
    const frontGeom = new THREE.BufferGeometry();
    const hw = width / 2, hd = depth / 2, e = 0.8; // e = overhang
    const verts = new Float32Array([
      // 前坡
      -hw - e, 0, hd + e,  hw - e*0.3, 0, hd + e,  hw * 0.35, height, hd * 0.3,
      -hw - e, 0, hd + e,  hw * 0.35, height, hd * 0.3,  -hw * 0.35, height, hd * 0.3,
      // 后坡
      hw - e*0.3, 0, -hd - e,  -hw - e, 0, -hd - e,  -hw * 0.35, height, -hd * 0.3,
      hw - e*0.3, 0, -hd - e,  -hw * 0.35, height, -hd * 0.3,  hw * 0.35, height, -hd * 0.3,
      // 左坡
      -hw - e, 0, hd + e,  -hw * 0.35, height, -hd * 0.3,  -hw * 0.35, height, hd * 0.3,
      -hw - e, 0, hd + e,  -hw - e, 0, -hd - e,  -hw * 0.35, height, -hd * 0.3,
      // 右坡
      hw - e*0.3, 0, -hd - e,  hw - e*0.3, 0, hd + e,  hw * 0.35, height, hd * 0.3,
      hw - e*0.3, 0, -hd - e,  hw * 0.35, height, hd * 0.3,  hw * 0.35, height, -hd * 0.3,
    ]);
    frontGeom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    frontGeom.computeVertexNormals();
    const roofMesh = new THREE.Mesh(frontGeom, mat.roof);
    roofMesh.castShadow = true;
    roofMesh.receiveShadow = true;
    group.add(roofMesh);

    // 鸱吻（屋脊两端装饰）
    for (const sign of [-1, 1]) {
      const ornament = new THREE.ConeGeometry(0.6, 1.5, 4);
      const ornMesh = new THREE.Mesh(ornament, mat.gold);
      ornMesh.position.set(sign * width * 0.35, height + 0.75, -depth * 0.15);
      ornMesh.rotation.y = Math.PI / 4;
      ornMesh.castShadow = true;
      group.add(ornMesh);
    }
  } else if (style === 'xieshan') {
    // 歇山顶
    const hw = width / 2, hd = depth / 2, e = 0.8;
    
    // 上部屋脊
    const ridgeGeom = new THREE.BoxGeometry(width * 0.6, 0.35, 0.4);
    const ridge = new THREE.Mesh(ridgeGeom, mat.roofDark);
    ridge.position.set(0, height, 0);
    ridge.castShadow = true;
    group.add(ridge);

    // 前后坡（上部三角形区域）
    const upperGeom = new THREE.BufferGeometry();
    const uv = new Float32Array([
      -hw * 0.4, height, hd * 0.2,  hw * 0.4, height, hd * 0.2,  hw, 0, hd,
      -hw * 0.4, height, hd * 0.2,  hw, 0, hd,  -hw, 0, hd,
      hw * 0.4, height, -hd * 0.2,  -hw * 0.4, height, -hd * 0.2,  -hw, 0, -hd,
      hw * 0.4, height, -hd * 0.2,  -hw, 0, -hd,  hw, 0, -hd,
    ]);
    upperGeom.setAttribute('position', new THREE.BufferAttribute(uv, 3));
    upperGeom.computeVertexNormals();
    const upperMesh = new THREE.Mesh(upperGeom, mat.roof);
    upperMesh.castShadow = true;
    upperMesh.receiveShadow = true;
    group.add(upperMesh);
  }
  
  return group;
}

// 创建斗拱
function createDougong(x, y, z, scale = 1) {
  const group = new THREE.Group();
  
  // 栌斗（底座）
  const ludou = new THREE.Mesh(
    new THREE.BoxGeometry(1.2 * scale, 0.6 * scale, 1.2 * scale),
    mat.woodDark
  );
  ludou.castShadow = true;
  group.add(ludou);

  // 横拱
  for (let i = 0; i < 2; i++) {
    const heng = new THREE.Mesh(
      new THREE.BoxGeometry(3 * scale, 0.35 * scale, 0.4 * scale),
      mat.wood
    );
    heng.position.y = (0.5 + i * 0.4) * scale;
    heng.castShadow = true;
    group.add(heng);
  }

  // 小斗
  for (const sign of [-1, 0, 1]) {
    const xiaodou = new THREE.Mesh(
      new THREE.BoxGeometry(0.5 * scale, 0.3 * scale, 0.5 * scale),
      mat.woodDark
    );
    xiaodou.position.set(sign * 1 * scale, 0.75 * scale, 0);
    xiaodou.castShadow = true;
    group.add(xiaodou);
  }

  group.position.set(x, y, z);
  return group;
}

// 创建柱子
function createPillar(x, z, height, radius = 0.35) {
  const geom = new THREE.CylinderGeometry(radius, radius * 1.1, height, 12);
  const mesh = new THREE.Mesh(geom, mat.pillar);
  mesh.position.set(x, height / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// 创建台基
function createPlatform(width, depth, height, x = 0, z = 0) {
  const group = new THREE.Group();
  
  const baseGeom = new THREE.BoxGeometry(width, height, depth);
  const base = new THREE.Mesh(baseGeom, mat.stone);
  base.position.set(x, height / 2, z);
  base.receiveShadow = true;
  base.castShadow = true;
  group.add(base);

  // 台基边缘条石
  const edgeGeom = new THREE.BoxGeometry(width + 0.3, 0.2, depth + 0.3);
  const edge = new THREE.Mesh(edgeGeom, mat.stone);
  edge.position.set(x, height + 0.1, z);
  edge.receiveShadow = true;
  group.add(edge);

  // 台阶（正面）
  const stepsGeom = new THREE.BoxGeometry(width * 0.4, height * 0.8, 1.5);
  const steps = new THREE.Mesh(stepsGeom, mat.stone);
  steps.position.set(x, height * 0.4, z + depth / 2 + 0.75);
  steps.receiveShadow = true;
  group.add(steps);

  return group;
}

// ════════════════════════════════════════
//  创建善化寺各建筑
// ════════════════════════════════════════

const clickableGroups = [];
const allBuildings = new THREE.Group();
scene.add(allBuildings);

// ── 1. 山门（辽代）──
function buildShanmen() {
  const group = new THREE.Group();
  group.userData = {
    id: 'shanmen',
    name: '山门',
    era: '辽代',

function createCorridor(x1, z1, x2, z2, isHorizontal = false) {
  const group = new THREE.Group();
  const length = Math.hypot(x2 - x1, z2 - z1);
  const angle = Math.atan2(z2 - z1, x2 - x1);

  // 墙体
  const wallGeom = new THREE.BoxGeometry(length, 3, 0.3);
  const wall = new THREE.Mesh(wallGeom, mat.wallDark);
  wall.position.set((x1 + x2) / 2, 1.5, (z1 + z2) / 2);
  wall.rotation.y = -angle;
  wall.castShadow = true;
  wall.receiveShadow = true;
  group.add(wall);

  // 屋顶
  const roofGeom = new THREE.BoxGeometry(length + 1, 0.3, 2.5);
  const roof = new THREE.Mesh(roofGeom, mat.roof);
  roof.position.set((x1 + x2) / 2, 3.3, (z1 + z2) / 2);
  roof.rotation.y = -angle;
  roof.castShadow = true;
  group.add(roof);

  // 柱子
  const numPillars = Math.floor(length / 3);
  for (let i = 0; i <= numPillars; i++) {
    const t = i / numPillars;
    const px = x1 + (x2 - x1) * t;
    const pz = z1 + (z2 - z1) * t;
    group.add(createPillar(px, pz, 3, 0.2));
  }

  return group;
}

  const chaoyan = new THREE.Mesh(
    new THREE.BoxGeometry(5 * scale, 0.35 * scale, 0.35 * scale),
    mat.wood
  );
  chaoyan.position.set(0, 2.1 * scale, 3.5 * scale);
  chaoyan.castShadow = true;
  group.add(chaoyan);

  group.position.set(24, 2, -8);
  group.scale.set(0.8, 0.8, 0.8);
  return group;
}

// ── 7. 中轴线庭院 ──
function buildCourtyard() {
  const group = new THREE.Group();
  group.userData = {
    id: 'courtyard',
    name: '中轴线庭院',
    era: '辽金',
    icon: '🌳',
    info: {
      '年代': '辽金时期',
      '布局': '中轴对称',
      '描述': '善化寺总体布局为中轴对称，中轴线上依次为山门、三圣殿、大雄宝殿，两侧有普贤阁及配殿廊庑。这种布局体现了中国传统建筑的礼制思想，也是辽金时期寺院布局的典型范例。',
      '布局特征': '山门—三圣殿—大雄宝殿三座主建筑沿中轴线由南向北递进，每座建筑前有月台庭院，形成层层递进的空间序列。普贤阁位于大雄宝殿西侧，与东侧楼阁遥相呼应（东楼阁已毁）。'
    }
  };

  // 庭院地面
  const groundGeom = new THREE.PlaneGeometry(70, 70);
  const ground = new THREE.Mesh(groundGeom, mat.ground);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0.05;
  ground.receiveShadow = true;
  group.add(ground);

  // 庭院铺装纹理（砖石）
  const tileGroup = new THREE.Group();
  for (let x = -30; x <= 30; x += 3) {
    for (let z = -30; z <= 30; z += 3) {
      if (Math.abs(x) < 30 && Math.abs(z) < 30) {
        const tile = new THREE.Mesh(
          new THREE.BoxGeometry(2.8, 0.05, 2.8),
          mat.tile
        );
        tile.position.set(x, 0.08, z);
        tile.receiveShadow = true;
        tileGroup.add(tile);
      }
    }
  }
  group.add(tileGroup);

  // 中轴线甬道
  const pathGeom = new THREE.BoxGeometry(4, 0.1, 55);
  const path = new THREE.Mesh(pathGeom, mat.stone);
  path.position.set(0, 0.1, 0);
  path.receiveShadow = true;
  group.add(path);

  // 古树点缀
  for (const [tx, tz] of [[-15, 15], [15, 15], [-12, -2], [12, -2]]) {
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.4, 4, 8),
      mat.woodDark
    );
    trunk.position.set(tx, 2, tz);
    trunk.castShadow = true;
    group.add(trunk);

    const crown = new THREE.Mesh(
      new THREE.SphereGeometry(2.5, 12, 8),
      new THREE.MeshStandardMaterial({ color: 0x4a5c3a, roughness: 0.9 })
    );
    crown.position.set(tx, 5, tz);
    crown.castShadow = true;
    group.add(crown);
  }

  // 香炉
  const xiangluBase = new THREE.Mesh(
    new THREE.CylinderGeometry(1, 1.2, 0.5, 8),
    mat.stone
  );
  xiangluBase.position.set(0, 0.3, 3);
  xiangluBase.castShadow = true;
  group.add(xiangluBase);

  const xiangluBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.8, 0.6, 1.5, 8),
    mat.gold
  );
  xiangluBody.position.set(0, 1.3, 3);
  xiangluBody.castShadow = true;
  group.add(xiangluBody);

  return group;
}

// ════════════════════════════════════════
//  交互系统
// ════════════════════════════════════════

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredObject = null;
let selectedObject = null;
let autoRotate = false;
let exploded = false;
const explodeOffsets = {};

// 记录每个可点击组的原始位置
clickableGroups.forEach(g => {
  explodeOffsets[g.userData.id] = {
    x: g.position.x,
    y: g.position.y,
    z: g.position.z
  };
});

// 拆解偏移量
const explodeDirections = {
  'courtyard': { x: 0, y: -3, z: 0 },
  'shanmen': { x: 0, y: 0, z: 15 },
  'sansheng': { x: 0, y: 5, z: 0 },
  'daxiong': { x: 0, y: 0, z: -15 },
  'puxian': { x: -15, y: 5, z: 0 },
  'peidian': { x: 15, y: 0, z: 0 },
  'dougong': { x: 15, y: 8, z: 5 },
  'statues': { x: 0, y: 12, z: 0 },
};

// ── 鼠标移动检测 ──
function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  
  // 收集所有可点击的mesh
  const clickableMeshes = [];
  clickableGroups.forEach(g => {
    g.traverse(child => {
      if (child.isMesh) {
        child.userData.clickableGroup = g;
        clickableMeshes.push(child);
      }
    });
  });

  const intersects = raycaster.intersectObjects(clickableMeshes);

  const tooltip = document.getElementById('hover-tooltip');
  const tooltipName = document.getElementById('tooltip-name');
  const tooltipEra = document.getElementById('tooltip-era');

  if (intersects.length > 0) {
    const obj = intersects[0].object.userData.clickableGroup;
    if (obj && obj !== hoveredObject) {
      // 恢复之前的高亮
      if (hoveredObject && hoveredObject !== selectedObject) {
        resetHighlight(hoveredObject);
      }
      hoveredObject = obj;
      highlightObject(obj);
    }

    // 显示tooltip
    tooltipName.textContent = obj.userData.name;
    tooltipEra.textContent = obj.userData.era;
    tooltip.style.left = (event.clientX + 15) + 'px';
    tooltip.style.top = (event.clientY + 15) + 'px';
    tooltip.classList.add('visible');
    document.body.style.cursor = 'pointer';
  } else {
    if (hoveredObject && hoveredObject !== selectedObject) {
      resetHighlight(hoveredObject);
    }
    hoveredObject = null;
    tooltip.classList.remove('visible');
    document.body.style.cursor = 'default';
  }
}

function highlightObject(group) {
  group.traverse(child => {
    if (child.isMesh && child.material) {
      if (!child.userData.origEmissive) {
        child.userData.origEmissive = child.material.emissive ? child.material.emissive.getHex() : 0;
        child.userData.origEmissiveIntensity = child.material.emissiveIntensity || 0;
      }
      if (child.material.emissive) {
        child.material.emissive.setHex(0xd4af6e);
        child.material.emissiveIntensity = 0.25;
      }
    }
  });
}

function resetHighlight(group) {
  group.traverse(child => {
    if (child.isMesh && child.material && child.material.emissive) {
      if (child.userData.origEmissive !== undefined) {
        child.material.emissive.setHex(child.userData.origEmissive);
        child.material.emissiveIntensity = child.userData.origEmissiveIntensity;
      }
    }
  });
}

// ── 点击事件 ──
function onClick(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const clickableMeshes = [];
  clickableGroups.forEach(g => {
    g.traverse(child => {
      if (child.isMesh) {
        child.userData.clickableGroup = g;
        clickableMeshes.push(child);
      }
    });
  });

  const intersects = raycaster.intersectObjects(clickableMeshes);

  if (intersects.length > 0) {
    const obj = intersects[0].object.userData.clickableGroup;
    if (obj) {
      showInfoPanel(obj);
      
      // 恢复之前选中
      if (selectedObject && selectedObject !== obj) {
        resetHighlight(selectedObject);
      }
      selectedObject = obj;
      highlightObject(obj);

      // 相机聚焦
      focusOnObject(obj);
    }
  }
}

function focusOnObject(group) {
  const box = new THREE.Box3().setFromObject(group);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = maxDim * 2 + 15;

  const targetPos = new THREE.Vector3(
    center.x + dist * 0.7,
    center.y + dist * 0.5,
    center.z + dist * 0.7
  );

  animateCamera(targetPos, center);
}

function animateCamera(targetPos, targetLook) {
  const startPos = camera.position.clone();
  const startLook = controls.target.clone();
  const duration = 1000;
  const startTime = performance.now();

  function step() {
    const elapsed = performance.now() - startTime;
    const t = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3); // easeOutCubic

    camera.position.lerpVectors(startPos, targetPos, ease);
    controls.target.lerpVectors(startLook, targetLook, ease);
    controls.update();

    if (t < 1) requestAnimationFrame(step);
  }
  step();
}

// ── 信息面板 ──
function showInfoPanel(group) {
  const data = group.userData;
  const panel = document.getElementById('info-panel');
  document.getElementById('panel-icon').textContent = data.icon || '🏛';
  document.getElementById('panel-name').textContent = data.name;
  document.getElementById('panel-era').textContent = data.era;

  const body = document.getElementById('panel-body');
  const info = data.info;

  let html = '';
  
  // 信息网格
  const gridKeys = Object.keys(info).filter(k => 
    ['年代', '形制', '屋顶', '位置', '数量', '类型', '斜拱', '布局', '塑像'].includes(k)
  );
  if (gridKeys.length > 0) {
    html += '<div class="panel-section"><div class="section-title">基本档案</div><div class="info-grid">';
    gridKeys.forEach(k => {
      html += `<div class="info-cell"><div class="info-cell-label">${k}</div><div class="info-cell-value">${info[k]}</div></div>`;
    });
    html += '</div></div>';
  }

  // 描述
  if (info['描述']) {
    html += `<div class="panel-section"><div class="section-title">详细说明</div><div class="section-text">${info['描述']}</div></div>`;
  }

  // 建筑特征
  if (info['建筑特征'] || info['艺术价值'] || info['布局特征']) {
    const title = info['建筑特征'] ? '建筑特征' : (info['艺术价值'] ? '艺术价值' : '布局特征');
    const text = info['建筑特征'] || info['艺术价值'] || info['布局特征'];
    html += `<div class="panel-section"><div class="section-title">${title}</div><div class="section-text">${text}</div></div>`;
  }

  body.innerHTML = html;
  panel.classList.add('visible');
}

document.getElementById('panel-close').addEventListener('click', () => {
  document.getElementById('info-panel').classList.remove('visible');
  if (selectedObject) {
    resetHighlight(selectedObject);
    selectedObject = null;
  }
});

// ── 按钮控制 ──
const btnRotate = document.getElementById('btn-rotate');
const btnExplode = document.getElementById('btn-explode');
const btnReset = document.getElementById('btn-reset');

btnRotate.addEventListener('click', () => {
  autoRotate = !autoRotate;
  btnRotate.classList.toggle('active', autoRotate);
});

btnExplode.addEventListener('click', () => {
  exploded = !exploded;
  btnExplode.classList.toggle('active', exploded);
  
  clickableGroups.forEach(g => {
    const id = g.userData.id;
    const orig = explodeOffsets[id];
    const dir = explodeDirections[id] || { x: 0, y: 5, z: 0 };
    
    const targetX = exploded ? orig.x + dir.x : orig.x;
    const targetY = exploded ? orig.y + dir.y : orig.y;
    const targetZ = exploded ? orig.z + dir.z : orig.z;

    const startX = g.position.x;
    const startY = g.position.y;
    const startZ = g.position.z;
    const duration = 800;
    const startTime = performance.now();

    function animateExplode() {
      const elapsed = performance.now() - startTime;
      const t = Math.min(elapsed / duration, 1);
      const ease = 1 - Math.pow(1 - t, 3);

      g.position.x = startX + (targetX - startX) * ease;
      g.position.y = startY + (targetY - startY) * ease;
      g.position.z = startZ + (targetZ - startZ) * ease;

      if (t < 1) requestAnimationFrame(animateExplode);
    }
    animateExplode();
  });
});

btnReset.addEventListener('click', () => {
  animateCamera(defaultCamPos, new THREE.Vector3(0, 5, 0));
  if (selectedObject) {
    resetHighlight(selectedObject);
    selectedObject = null;
  }
  document.getElementById('info-panel').classList.remove('visible');
});

// ── 图层选择器 ──
const layerItems = document.getElementById('layer-items');
clickableGroups.forEach(g => {
  const item = document.createElement('div');
  item.className = 'layer-item';
  item.textContent = g.userData.name;
  item.dataset.id = g.userData.id;
  item.addEventListener('click', () => {
    document.querySelectorAll('.layer-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    showInfoPanel(g);
    if (selectedObject && selectedObject !== g) {
      resetHighlight(selectedObject);
    }
    selectedObject = g;
    highlightObject(g);
    focusOnObject(g);
  });
  layerItems.appendChild(item);
});

// ════════════════════════════════════════
//  事件监听
// ════════════════════════════════════════
window.addEventListener('mousemove', onMouseMove);
window.addEventListener('click', onClick);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ════════════════════════════════════════
//  动画循环
// ════════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);

  if (autoRotate) {
    allBuildings.rotation.y += 0.003;
  }

  controls.update();
  renderer.render(scene, camera);
}

window.THREE = THREE;
window.scene = scene;
window.camera = camera;
window.renderer = renderer;
animate();
