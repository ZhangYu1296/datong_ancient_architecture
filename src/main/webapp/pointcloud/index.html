<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山西古建 · 三维全景</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1410'/%3E%3Cpath d='M32 10 L50 22 L50 40 L32 54 L14 40 L14 22 Z' fill='%23c9a84c'/%3E%3Cpath d='M22 24 L42 24 M22 30 L42 30 M22 36 L42 36' stroke='%231a1410' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
:root {
  --ink-deep: #0a0e12;
  --ink-dark: #131820;
  --ink-mid: #1e2530;
  --stone: #3a4250;
  --wood-light: #c8a878;
  --wood-mid: #9a7848;
  --wood-dark: #5a3e22;
  --gold: #d4a84b;
  --gold-bright: #e8c878;
  --gold-dim: #9a7a30;
  --red-seal: #b8362e;
  --moss: #5a6a48;
  --text-light: #d8d0c0;
  --text-dim: #a09888;
  --text-mute: #6a6258;
  --tang: #c87a3a;
  --liao: #8a6a3a;
  --wudai: #7a6a4a;
  --song: #5a8a4a;
  --jin: #6a5a8a;
  --ming: #b8983a;
  --qing: #4a7a7a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--ink-deep);
  font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', '宋体', serif;
  color: var(--text-light);
}

/* ===== Views ===== */
.view {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: none;
}
.view.active { display: block; }

/* ===== Map View ===== */
#map-view {
  background: radial-gradient(ellipse at center, #1a2028 0%, #0a0e12 70%);
}

#map-view::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(90, 106, 72, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 60%, rgba(212, 168, 75, 0.04) 0%, transparent 40%);
  pointer-events: none;
  z-index: 1;
}

#shanxi-svg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 2;
  transition: viewBox 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
  cursor: grab;
}
#shanxi-svg:active { cursor: grabbing; }

.city-path {
  fill: rgba(30, 37, 48, 0.25);
  stroke: rgba(196, 168, 120, 0.18);
  stroke-width: 1;
  transition: fill 0.3s, stroke 0.3s;
  cursor: pointer;
}
.city-path:hover {
  fill: rgba(58, 42, 24, 0.25);
  stroke: rgba(196, 168, 120, 0.4);
}
.city-path.active {
  fill: rgba(58, 42, 24, 0.5);
  stroke: rgba(212, 168, 75, 0.7);
  stroke-width: 1.5;
}
.city-label {
  font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', '宋体', serif;
  font-size: 9px;
  font-weight: 300;
  fill: rgba(160, 152, 136, 0.35);
  text-anchor: middle;
  pointer-events: none;
  transition: fill 0.3s, opacity 0.3s;
  letter-spacing: 0.05em;
}
.city-path:hover + .city-label,
.city-label:hover {
  fill: rgba(212, 168, 75, 0.7);
}

/* 河流已移除 */

/* ===== Markers (no CSS transform conflict) ===== */
.marker-group { cursor: pointer; }

.marker-pulse {
  fill: none;
  stroke-width: 1.5;
  opacity: 0;
  animation: pulse 2.5s ease-out infinite;
}
@keyframes pulse {
  0% { opacity: 0.5; }
  100% { opacity: 0; }
}

.marker-dot {
  stroke: rgba(255, 255, 255, 0.3);
  stroke-width: 1.5;
  filter: drop-shadow(0 0 4px currentColor);
  transition: r 0.2s, filter 0.2s;
}

.marker-group:hover .marker-dot {
  r: 8;
  filter: drop-shadow(0 0 8px currentColor);
}

.marker-ring {
  fill: none;
  stroke-width: 1;
  opacity: 0.4;
  transition: opacity 0.2s, r 0.2s;
}

.marker-group:hover .marker-ring {
  opacity: 0.7;
  r: 14;
}

.marker-label {
  font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', '宋体', serif;
  font-size: 11px;
  font-weight: 600;
  fill: var(--text-light);
  paint-order: stroke;
  stroke: rgba(10, 14, 18, 0.9);
  stroke-width: 3;
  pointer-events: none;
  opacity: 0.8;
  transition: opacity 0.2s, fill 0.2s;
}
.marker-group:hover .marker-label {
  opacity: 1;
  fill: var(--gold-bright);
}

.marker-era {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 9px;
  fill: var(--text-mute);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  pointer-events: none;
}

/* ===== Timeline View ===== */
#timeline-view {
  background: radial-gradient(ellipse at center, #1a1a14 0%, #0a0a06 70%);
  overflow-y: auto;
  overflow-x: hidden;
}

#timeline-view::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(200, 122, 58, 0.05) 0%, transparent 40%),
    radial-gradient(ellipse at 80% 80%, rgba(90, 138, 74, 0.04) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
}

.timeline-container {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 8rem 2rem 4rem;
}

.timeline-title {
  text-align: center;
  margin-bottom: 3rem;
}

.timeline-title h1 {
  font-family: 'ZCOOL XiaoWei', 'Songti SC', 'STSong', '宋体', serif;
  font-size: 2rem;
  color: var(--gold-bright);
  letter-spacing: 0.15em;
  margin-bottom: 0.5rem;
}

.timeline-title p {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 0.85rem;
  color: var(--text-mute);
  letter-spacing: 0.25em;
  text-transform: uppercase;
}

/* Era sections */
.era-section {
  margin-bottom: 3rem;
  position: relative;
}

.era-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.era-badge {
  width: 80px; height: 80px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'ZCOOL XiaoWei', 'Songti SC', 'STSong', '宋体', serif;
  font-size: 1.8rem;
  color: #fff;
  flex-shrink: 0;
  position: relative;
  box-shadow: 0 0 20px currentColor;
}

.era-badge::after {
  content: '';
  position: absolute;
  top: 100%; left: 50%;
  width: 2px; height: 60px;
  background: linear-gradient(to bottom, currentColor, transparent);
  transform: translateX(-50%);
}

.era-badge.tang { background: var(--tang); color: var(--tang); }
.era-badge.tang::after { background: linear-gradient(to bottom, var(--tang), transparent); }
.era-badge.tang span { color: #fff; }

.era-badge.liao { background: var(--liao); color: var(--liao); }
.era-badge.liao::after { background: linear-gradient(to bottom, var(--liao), transparent); }
.era-badge.liao span { color: #fff; }

.era-badge.wudai { background: var(--wudai); color: var(--wudai); }
.era-badge.wudai::after { background: linear-gradient(to bottom, var(--wudai), transparent); }
.era-badge.wudai span { color: #fff; }

.era-badge.song { background: var(--song); color: var(--song); }
.era-badge.song::after { background: linear-gradient(to bottom, var(--song), transparent); }
.era-badge.song span { color: #fff; }

.era-badge.jin { background: var(--jin); color: var(--jin); }
.era-badge.jin::after { background: linear-gradient(to bottom, var(--jin), transparent); }
.era-badge.jin span { color: #fff; }

.era-badge.ming { background: var(--ming); color: var(--ming); }
.era-badge.ming::after { background: linear-gradient(to bottom, var(--ming), transparent); }
.era-badge.ming span { color: #fff; }

.era-info h2 {
  font-family: 'ZCOOL XiaoWei', 'Songti SC', 'STSong', '宋体', serif;
  font-size: 1.4rem;
  color: var(--gold-bright);
  letter-spacing: 0.08em;
}

.era-info .era-dates {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 0.82rem;
  color: var(--gold-dim);
  letter-spacing: 0.15em;
  margin-top: 0.2rem;
}

.era-info .era-desc {
  font-size: 0.82rem;
  color: var(--text-dim);
  margin-top: 0.5rem;
  max-width: 600px;
  line-height: 1.7;
}

/* Building cards in timeline */
.era-buildings {
  display: flex;
  gap: 1.2rem;
  flex-wrap: wrap;
  padding-left: 96px;
}

.tl-building-card {
  width: 260px;
  background: rgba(19, 24, 32, 0.8);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(196, 168, 120, 0.15);
  border-radius: 5px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s ease;
  flex-shrink: 0;
  position: relative;
}

.tl-building-card:hover {
  border-color: var(--gold-dim);
  transform: translateY(-4px);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
}

.tl-card-glyph {
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'ZCOOL XiaoWei', 'Songti SC', 'STSong', '宋体', serif;
  font-size: 2.5rem;
  color: var(--gold);
  position: relative;
  overflow: hidden;
}

.tl-card-year {
  position: absolute;
  top: 0.5rem; right: 0.6rem;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 0.72rem;
  color: var(--gold-bright);
  letter-spacing: 0.1em;
  background: rgba(10, 14, 18, 0.7);
  padding: 0.2rem 0.5rem;
  border-radius: 2px;
  border: 1px solid rgba(196, 168, 120, 0.2);
}

.tl-card-body { padding: 0.8rem 1rem; }

.tl-card-name {
  font-family: 'ZCOOL XiaoWei', 'Songti SC', 'STSong', '宋体', serif;
  font-size: 1.05rem;
  color: var(--gold-bright);
  margin-bottom: 0.15rem;
}

.tl-card-location {
  font-size: 0.7rem;
  color: var(--text-mute);
  margin-bottom: 0.4rem;
}

.tl-card-desc {
  font-size: 0.75rem;
  color: var(--text-dim);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.tl-card-significance {
  margin-top: 0.5rem;
  padding-top: 0.5rem;
  border-top: 1px solid rgba(196, 168, 120, 0.1);
  font-size: 0.7rem;
  color: var(--gold-dim);
  font-style: italic;
}

/* ===== Header ===== */
#header {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 1.2rem 2.5rem 0.8rem;
  z-index: 100;
  background: linear-gradient(to bottom, rgba(10, 14, 18, 0.92) 0%, rgba(10, 14, 18, 0) 100%);
  pointer-events: none;
}
.header-content {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.header-left { pointer-events: auto; }
.header-title {
  font-family: 'ZCOOL XiaoWei', 'Songti SC', 'STSong', '宋体', serif;
  font-size: 2rem;
  color: var(--gold-bright);
  letter-spacing: 0.12em;
  line-height: 1;
  text-shadow: 0 2px 16px rgba(212, 168, 75, 0.2);
}
.header-sub {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 0.8rem;
  color: var(--text-mute);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-top: 0.3rem;
}
.header-right {
  pointer-events: auto;
  display: flex;
  gap: 1.5rem;
  align-items: center;
}
.stat-block { text-align: right; }
.stat-num {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 1.6rem;
  color: var(--gold-bright);
  font-weight: 600;
  line-height: 1;
}
.stat-label {
  font-size: 0.65rem;
  color: var(--text-mute);
  letter-spacing: 0.15em;
  margin-top: 0.2rem;
}

/* ===== View Toggle ===== */
#view-toggle {
  position: fixed;
  top: 5.5rem;
  right: 2.5rem;
  z-index: 100;
  display: flex;
  gap: 0.3rem;
  background: rgba(19, 24, 32, 0.75);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(196, 168, 120, 0.15);
  border-radius: 4px;
  padding: 0.25rem;
}
.view-btn {
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 0.4rem 0.9rem;
  font-size: 0.78rem;
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.2s;
  font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', '宋体', serif;
}
.view-btn:hover { color: var(--gold-bright); }
.view-btn.active {
  background: rgba(90, 62, 34, 0.5);
  color: var(--gold-bright);
}

/* ===== Legend ===== */
#legend {
  position: fixed;
  top: 5.5rem;
  left: 2.5rem;
  z-index: 50;
  background: rgba(19, 24, 32, 0.75);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(196, 168, 120, 0.2);
  border-radius: 4px;
  padding: 0.8rem 1rem;
  pointer-events: auto;
}
.legend-title {
  font-size: 0.68rem;
  color: var(--text-mute);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
}
.legend-items { display: flex; flex-direction: column; gap: 0.3rem; }
.legend-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.74rem;
  color: var(--text-dim);
}
.legend-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}
.legend-dot.tang { background: var(--tang); box-shadow: 0 0 5px var(--tang); }
.legend-dot.liao { background: var(--liao); box-shadow: 0 0 5px var(--liao); }
.legend-dot.wudai { background: var(--wudai); box-shadow: 0 0 5px var(--wudai); }
.legend-dot.song { background: var(--song); box-shadow: 0 0 5px var(--song); }
.legend-dot.jin { background: var(--jin); box-shadow: 0 0 5px var(--jin); }
.legend-dot.ming { background: var(--ming); box-shadow: 0 0 5px var(--ming); }

/* ===== Info Card ===== */
#info-card {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translate(-50%, 120%);
  width: 640px;
  max-width: 90%;
  background: rgba(13, 17, 24, 0.95);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(196, 168, 120, 0.3);
  border-radius: 6px;
  padding: 1.5rem 2rem;
  z-index: 200;
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
  display: flex;
  gap: 1.5rem;
  align-items: center;
}
#info-card.visible { transform: translate(-50%, 0); }

.card-visual {
  width: 90px; height: 90px;
  flex-shrink: 0;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--ink-mid), var(--ink-dark));
  border: 1px solid rgba(196, 168, 120, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'ZCOOL XiaoWei', 'Songti SC', 'STSong', '宋体', serif;
  font-size: 2.2rem;
  color: var(--gold);
}
.card-content { flex: 1; }
.card-header {
  display: flex;
  align-items: baseline;
  gap: 0.8rem;
  margin-bottom: 0.4rem;
}
.card-name {
  font-family: 'ZCOOL XiaoWei', 'Songti SC', 'STSong', '宋体', serif;
  font-size: 1.4rem;
  color: var(--gold-bright);
  line-height: 1;
}
.card-era {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 0.75rem;
  color: var(--gold-dim);
  letter-spacing: 0.15em;
}
.card-location { font-size: 0.75rem; color: var(--text-mute); margin-bottom: 0.5rem; }
.card-desc { font-size: 0.82rem; color: var(--text-dim); line-height: 1.7; margin-bottom: 0.7rem; }
.card-data { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.7rem; }
.data-pill {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.7rem;
  color: var(--text-mute);
}
.data-pill strong {
  color: var(--gold-bright);
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 0.82rem;
  font-weight: 600;
}
.card-actions { display: flex; gap: 0.6rem; }

.btn-enter {
  background: linear-gradient(135deg, var(--wood-dark), var(--wood-mid));
  border: 1px solid var(--gold-dim);
  color: var(--gold-bright);
  padding: 0.5rem 1.5rem;
  font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', '宋体', serif;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.3s ease;
  letter-spacing: 0.05em;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.btn-enter:hover {
  background: linear-gradient(135deg, var(--wood-mid), var(--wood-light));
  box-shadow: 0 0 20px rgba(212, 168, 75, 0.3);
  transform: translateY(-1px);
}
.btn-close-card {
  background: rgba(30, 37, 48, 0.6);
  border: 1px solid rgba(196, 168, 120, 0.2);
  color: var(--text-dim);
  padding: 0.5rem 1rem;
  font-size: 0.8rem;
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.2s;
}
.btn-close-card:hover { color: var(--text-light); border-color: rgba(196, 168, 120, 0.4); }

/* ===== Grid View ===== */
#grid-view {
  background: radial-gradient(ellipse at center, #1a2028 0%, #0a0e12 70%);
  overflow-y: auto;
}
.grid-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 8rem 2rem 4rem;
  display: flex;
  flex-wrap: wrap;
  gap: 1.2rem;
  justify-content: center;
}
.grid-card {
  width: 270px;
  background: rgba(19, 24, 32, 0.8);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(196, 168, 120, 0.15);
  border-radius: 5px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s ease;
  flex-shrink: 0;
}
.grid-card:hover {
  border-color: var(--gold-dim);
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
}
.grid-card-visual {
  height: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'ZCOOL XiaoWei', 'Songti SC', 'STSong', '宋体', serif;
  font-size: 2.6rem;
  color: var(--gold);
  position: relative;
  overflow: hidden;
}
.grid-card-era {
  position: absolute;
  top: 0.5rem; right: 0.6rem;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 0.65rem;
  color: var(--gold-dim);
  letter-spacing: 0.15em;
  background: rgba(10, 14, 18, 0.6);
  padding: 0.2rem 0.5rem;
  border-radius: 2px;
}
.grid-card-body { padding: 0.8rem 1rem; }
.grid-card-name {
  font-family: 'ZCOOL XiaoWei', 'Songti SC', 'STSong', '宋体', serif;
  font-size: 1.1rem;
  color: var(--gold-bright);
  margin-bottom: 0.2rem;
}
.grid-card-location { font-size: 0.7rem; color: var(--text-mute); margin-bottom: 0.4rem; }
.grid-card-desc {
  font-size: 0.76rem;
  color: var(--text-dim);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ===== Footer ===== */
#footer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 0.6rem 2.5rem;
  z-index: 50;
  text-align: center;
  background: linear-gradient(to top, rgba(10, 14, 18, 0.7) 0%, transparent 100%);
  pointer-events: none;
}
.footer-text {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 0.7rem;
  color: var(--text-mute);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

/* ===== Corner Deco ===== */
.corner-deco {
  position: fixed;
  width: 50px; height: 50px;
  pointer-events: none;
  z-index: 4;
  opacity: 0.15;
}
.corner-deco.tl { top: 0; left: 0; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); }
.corner-deco.tr { top: 0; right: 0; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); }

/* ===== Book View ===== */
#book-view {
  background: radial-gradient(ellipse at center, #1a1410 0%, #080604 70%);
  overflow: hidden;
}

#book-view::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse at 25% 30%, rgba(200, 168, 75, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 70%, rgba(184, 54, 46, 0.03) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
}

.book-stage {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 900px; max-width: 95%;
  height: 600px; max-height: 80%;
  z-index: 1;
  perspective: 2500px;
}

.book {
  position: relative;
  width: 100%; height: 100%;
}

/* Book base (left half + right half) — visible underneath the pages */
.book-base {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  z-index: 1;
}

.book-base-left, .book-base-right {
  width: 50%; height: 100%;
  background: linear-gradient(135deg, #2a2218, #1a140e);
  border: 1px solid rgba(196, 168, 120, 0.15);
  box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5);
}

.book-base-left {
  border-radius: 6px 0 0 6px;
  box-shadow: inset 10px 0 40px rgba(0, 0, 0, 0.5), -3px 3px 12px rgba(0, 0, 0, 0.4);
}

.book-base-right {
  border-radius: 0 6px 6px 0;
  box-shadow: inset -10px 0 40px rgba(0, 0, 0, 0.5), 3px 3px 12px rgba(0, 0, 0, 0.4);
}

/* Book pages container */
.book-pages {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 10;
}

.book-spine {
  position: absolute;
  top: 0; left: 50%;
  width: 6px; height: 100%;
  transform: translateX(-50%);
  background: linear-gradient(to right,
    rgba(0,0,0,0.7) 0%,
    rgba(0,0,0,0.4) 30%,
    rgba(196,168,120,0.15) 50%,
    rgba(0,0,0,0.4) 70%,
    rgba(0,0,0,0.7) 100%);
  z-index: 60;
  pointer-events: none;
  box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
}

/* Pages — stacked on right side, flip to left.
   Each page has its own perspective so we avoid preserve-3d on parent
   (which breaks z-index stacking). */
.book-page {
  position: absolute;
  top: 0; left: 50%;
  width: 50%; height: 100%;
  perspective: 1800px;
  cursor: pointer;
}

.book-page-inner {
  position: relative;
  width: 100%; height: 100%;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1);
}

.book-page.flipped .book-page-inner {
  transform: rotateY(-180deg);
}

.book-page.flipping {
  z-index: 100 !important;
}

.book-page-face {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
  padding: 1.8rem 1.4rem;
  box-sizing: border-box;
}

.book-page-front {
  background: linear-gradient(135deg, #2a2218, #1a140e);
  border-radius: 0 6px 6px 0;
  box-shadow: inset -8px 0 30px rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(196, 168, 120, 0.15);
  border-left: none;
}

.book-page-back {
  transform: rotateY(180deg);
  background: linear-gradient(225deg, #2a2218, #1a140e);
  border-radius: 6px 0 0 6px;
  box-shadow: inset 8px 0 30px rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(196, 168, 120, 0.15);
  border-right: none;
}

/* Page gradient overlay for depth */
.book-page-front::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 30px; height: 100%;
  background: linear-gradient(to left, rgba(0,0,0,0.25), transparent);
  pointer-events: none;
}

.book-page-back::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 30px; height: 100%;
  background: linear-gradient(to right, rgba(0,0,0,0.25), transparent);
  pointer-events: none;
}

/* Page content */
.page-num {

}
.book-page-front .page-num { right: 1.5rem; }
.book-page-back .page-num { left: 1.5rem; }

.page-chapter {

}

.page-era-tag {

  letter-spacing: 0.05em;
}

.page-body {

  text-align: justify;
  text-indent: 1.6rem;
}

.page-body p { margin-bottom: 0.6rem; }

.page-annotation {

  background: rgba(196, 168, 75, 0.06);
  border-left: 2px solid var(--gold-dim);
  border-radius: 0 3px 3px 0;
}

.page-annotation-label {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 0.65rem;
  color: var(--gold);
  letter-spacing: 0.2em;

}

.page-annotation-text {

}

.page-quote {

const cityPathsGroup = document.getElementById('city-paths');

function renderMapCities() {
  if (!cityPathsGroup || typeof SHANXI_CITY_PATHS === 'undefined') return;
  cityPathsGroup.innerHTML = '';
  Object.entries(SHANXI_CITY_PATHS).forEach(([cityName, cityData]) => {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.classList.add('city-path');
    path.setAttribute('d', cityData.d);
    path.dataset.city = cityName;
    path.addEventListener('click', (e) => {
      e.stopPropagation();
      switchToCity(cityName);
    });
    cityPathsGroup.appendChild(path);
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.classList.add('city-label');
    label.setAttribute('x', cityData.center[0]);
    label.setAttribute('y', cityData.center[1] - 8);
    label.textContent = cityName.replace('市', '');
    cityPathsGroup.appendChild(label);
  });
}

// ===== Map Zoom & Pan System =====
const svgEl = document.getElementById('shanxi-svg');
const VB_BASE = { x: 0, y: 0, w: 1000, h: 700 };
// 初始聚焦视图：直接框住全部古建标记，一进来即可看全所有点位（无需手动缩放）
const VB_HOME = { x: 105, y: 20, w: 771, h: 540 };
let vbState = { x: 0, y: 0, w: 1000, h: 700 };
let activeCity = null;

function setViewBox(vb, animate = true) {
  if (animate) {
    svgEl.style.transition = 'viewBox 0.6s cubic-bezier(0.25, 0.1, 0.25, 1)';
  } else {
    svgEl.style.transition = 'none';
  }
  vbState = { ...vb };
  svgEl.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  updateZoomControls();
}

function clampVB(vb) {
  // Prevent over-pan and over-zoom
  const minW = 120, maxW = 1200;
  const minH = 84, maxH = 840;
  vb.w = Math.max(minW, Math.min(maxW, vb.w));
  vb.h = Math.max(minH, Math.min(maxH, vb.h));
  vb.x = Math.max(-50, Math.min(1050 - vb.w, vb.x));
  vb.y = Math.max(-30, Math.min(730 - vb.h, vb.y));
  return vb;
}

// ===== Wheel Zoom (centered on cursor) =====
svgEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = svgEl.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width;
  const my = (e.clientY - rect.top) / rect.height;

  const factor = e.deltaY > 0 ? 1.15 : 0.87;
  const newW = vbState.w * factor;
  const newH = vbState.h * factor;

  // Zoom toward cursor position
  const cx = vbState.x + mx * vbState.w;
  const cy = vbState.y + my * vbState.h;
  const newX = cx - mx * newW;
  const newY = cy - my * newH;

  clampVB({ x: newX, y: newY, w: newW, h: newH });
  const clamped = clampVB({ x: newX, y: newY, w: newW, h: newH });
  setViewBox(clamped, false);
  clearCityHighlight();
}, { passive: false });

// ===== Drag Pan =====
let isDragging = false;
let dragStart = { x: 0, y: 0, vbX: 0, vbY: 0 };

svgEl.addEventListener('mousedown', (e) => {
  if (e.target.closest('.marker-group')) return; // don't drag on markers
  isDragging = true;
  dragStart = { x: e.clientX, y: e.clientY, vbX: vbState.x, vbY: vbState.y };
  svgEl.style.transition = 'none';
  svgEl.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const rect = svgEl.getBoundingClientRect();
  const scale = vbState.w / rect.width;
  const dx = (e.clientX - dragStart.x) * scale;
  const dy = (e.clientY - dragStart.y) * scale;
  const clamped = clampVB({ x: dragStart.vbX - dx, y: dragStart.vbY - dy, w: vbState.w, h: vbState.h });
  vbState = clamped;
  svgEl.setAttribute('viewBox', `${clamped.x} ${clamped.y} ${clamped.w} ${clamped.h}`);
});

window.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    svgEl.style.cursor = 'grab';
  }
});

// Touch support
let touchState = null;
svgEl.addEventListener('touchstart', (e) => {
  if (e.target.closest('.marker-group')) return;
  if (e.touches.length === 1) {
    touchState = { type: 'pan', x: e.touches[0].clientX, y: e.touches[0].clientY, vbX: vbState.x, vbY: vbState.y };
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchState = { type: 'pinch', dist: Math.hypot(dx, dy), vb: { ...vbState } };
  }
}, { passive: false });

svgEl.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!touchState) return;
  const rect = svgEl.getBoundingClientRect();
  if (touchState.type === 'pan' && e.touches.length === 1) {
    const scale = vbState.w / rect.width;
    const dx = (e.touches[0].clientX - touchState.x) * scale;
    const dy = (e.touches[0].clientY - touchState.y) * scale;
    const clamped = clampVB({ x: touchState.vbX - dx, y: touchState.vbY - dy, w: vbState.w, h: vbState.h });
    vbState = clamped;
    svgEl.setAttribute('viewBox', `${clamped.x} ${clamped.y} ${clamped.w} ${clamped.h}`);
  } else if (touchState.type === 'pinch' && e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const newDist = Math.hypot(dx, dy);
    const factor = touchState.dist / newDist;
    const newW = touchState.vb.w * factor;
    const newH = touchState.vb.h * factor;
    const clamped = clampVB({ x: touchState.vb.x + (touchState.vb.w - newW) / 2, y: touchState.vb.y + (touchState.vb.h - newH) / 2, w: newW, h: newH });
    setViewBox(clamped, false);
  }
}, { passive: false });

svgEl.addEventListener('touchend', () => { touchState = null; });

// ===== City Click → Zoom =====
function switchToCity(cityName) {
  const cityData = SHANXI_CITY_PATHS[cityName];
  if (!cityData) return;
  activeCity = cityName;

  // Highlight this city, dim others
  document.querySelectorAll('.city-path').forEach(p => {
    if (p.dataset.city === cityName) {
      p.classList.add('active');
    } else {
      p.style.opacity = '0.15';
    }
  });

  const [cx, cy] = cityData.center;
  const zoomW = 260, zoomH = 200;
  const vb = clampVB({ x: cx - zoomW/2, y: cy - zoomH/2, w: zoomW, h: zoomH });
  setViewBox(vb, true);
  showBackButton();
}

function clearCityHighlight() {
  if (!activeCity) return;
  activeCity = null;
  document.querySelectorAll('.city-path').forEach(p => {
    p.classList.remove('active');
    p.style.opacity = '';
  });
  hideBackButton();
}

function backToProvince() {
  setViewBox({ ...VB_HOME }, true);   // 返回古建标记全览
  clearCityHighlight();
}

// ===== Zoom Control Buttons =====
function updateZoomControls() {
  const z = VB_BASE.w / vbState.w;
  const pct = Math.round(z * 100);
  const label = document.getElementById('zoom-level');
  if (label) label.textContent = pct + '%';
}

function createZoomControls() {
  const container = document.createElement('div');
  container.id = 'zoom-controls';
  container.style.cssText = 'position:fixed;right:1.5rem;bottom:5rem;z-index:50;display:flex;flex-direction:column;gap:0.4rem;align-items:center;';

  const makeBtn = (text, fn) => {
    const btn = document.createElement('button');
    btn.textContent = text;
    btn.style.cssText = 'width:38px;height:38px;border-radius:6px;background:rgba(19,24,32,0.8);backdrop-filter:blur(8px);border:1px solid rgba(196,168,120,0.2);color:var(--gold-bright);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;font-family:serif;';
    btn.addEventListener('mouseenter', () => { btn.style.background = 'rgba(58,42,24,0.6)'; btn.style.borderColor = 'rgba(196,168,120,0.5)'; });
    btn.addEventListener('mouseleave', () => { btn.style.background = 'rgba(19,24,32,0.8)'; btn.style.borderColor = 'rgba(196,168,120,0.2)'; });
    btn.addEventListener('click', fn);
    return btn;
  };

  const zoomIn = makeBtn('+', () => {
    const cx = vbState.x + vbState.w/2;
    const cy = vbState.y + vbState.h/2;
    const newW = vbState.w * 0.7;
    const newH = vbState.h * 0.7;
    setViewBox(clampVB({ x: cx - newW/2, y: cy - newH/2, w: newW, h: newH }), true);
  });

  const zoomOut = makeBtn('−', () => {
    const cx = vbState.x + vbState.w/2;
    const cy = vbState.y + vbState.h/2;
    const newW = vbState.w * 1.43;
    const newH = vbState.h * 1.43;
    setViewBox(clampVB({ x: cx - newW/2, y: cy - newH/2, w: newW, h: newH }), true);
  });

  const reset = makeBtn('⤢', () => {
    setViewBox({ ...VB_HOME }, true);
    clearCityHighlight();
  });
  reset.style.fontSize = '1.3rem';

  const level = document.createElement('div');
  level.id = 'zoom-level';
  level.style.cssText = 'font-size:0.65rem;color:rgba(196,168,120,0.5);font-family:"Cormorant Garamond",serif;text-align:center;';
  level.textContent = '100%';

  container.appendChild(zoomIn);
  container.appendChild(level);
  container.appendChild(zoomOut);
  container.appendChild(reset);
  document.body.appendChild(container);
}

function showBackButton() {
  let btn = document.getElementById('back-to-province');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'back-to-province';
    btn.textContent = '← 返回全省';
    btn.style.cssText = 'position:fixed;top:5.5rem;left:2.5rem;z-index:100;background:rgba(19,24,32,0.85);backdrop-filter:blur(8px);border:1px solid rgba(196,168,120,0.3);border-radius:4px;padding:0.5rem 1rem;color:var(--gold-bright);font-family:"Noto Serif SC",serif;font-size:0.85rem;cursor:pointer;transition:all 0.3s;opacity:0;transform:translateY(-10px);';
    btn.addEventListener('click', backToProvince);
    document.body.appendChild(btn);
    requestAnimationFrame(() => {
      btn.style.opacity = '1';
      btn.style.transform = 'translateY(0)';
    });
  }
}

function hideBackButton() {
  const btn = document.getElementById('back-to-province');
  if (btn) {
    btn.style.opacity = '0';
    btn.style.transform = 'translateY(-10px)';
    setTimeout(() => btn.remove(), 300);
  }
}

  });
});

// ===== Render Timeline =====
function renderTimeline() {
  const container = document.getElementById('timeline-container');
  if (container.children.length > 0) return;

  const eraOrder = ['tang', 'wudai', 'liao', 'song', 'jin', 'ming'];
  const eraBuildings = {};
  eraOrder.forEach(e => eraBuildings[e] = []);
  BUILDINGS.forEach(b => {
    if (eraBuildings[b.era]) eraBuildings[b.era].push(b);
  });

  let html = `
    <div class="timeline-title">
      <h1>中国古建筑史 · 山西遗珍</h1>
      <p>A Journey Through Chinese Architectural History</p>
    </div>
  `;

  eraOrder.forEach(era => {
    const info = eraInfo[era];
    const buildings = eraBuildings[era];
    if (buildings.length === 0) return;
    const color = eraColors[era];

    html += `
      <div class="era-section">
        <div class="era-header">
          <div class="era-badge ${era}" style="background:${color};box-shadow:0 0 20px ${color}66;">
            <span>${info.name}</span>
          </div>
          <div class="era-info">
            <h2>${info.name}代建筑</h2>
            <div class="era-dates">${info.dates} · ${info.en}</div>
            <div class="era-desc">${info.desc}</div>
          </div>
        </div>
        <div class="era-buildings">
    `;

    buildings.sort((a, b) => a.year - b.year);
    buildings.forEach(b => {
      const yearLabel = b.eraLabel.split('·')[1]?.trim() || b.year;
      html += `
          <div class="tl-building-card" data-url="${b.url}">
            <div class="tl-card-glyph" style="background:linear-gradient(135deg,#1e2530,${color}55);">
              <span class="tl-card-year">${yearLabel}</span>
              ${b.char}
            </div>
            <div class="tl-card-body">
              <div class="tl-card-name">${b.name}</div>
              <div class="tl-card-location">📍 ${b.location}</div>
              <div class="tl-card-desc">${b.desc}</div>
              <div class="tl-card-significance">✦ ${b.significance}</div>
            </div>
          </div>
      `;
    });

    html += `
        </div>
      </div>
    `;
  });

  container.innerHTML = html;

  // Bind clicks
  container.querySelectorAll('.tl-building-card').forEach(card => {
    card.addEventListener('click', () => {
      window.open(card.dataset.url, '_blank');
    });
  });
}

// ===== Render Grid =====
function renderGrid() {
  const container = document.getElementById('grid-container');
  if (container.children.length > 0) return;

  BUILDINGS.forEach(b => {
    const card = document.createElement('div');
    card.className = 'grid-card';
    card.innerHTML = `
      <div class="grid-card-visual" style="background: linear-gradient(135deg, #1e2530, ${eraColors[b.era]}66);">
        <span class="grid-card-era">${b.eraLabel}</span>
        ${b.char}
      </div>
      <div class="grid-card-body">
        <div class="grid-card-name">${b.name}</div>
        <div class="grid-card-location">📍 ${b.location}</div>
        <div class="grid-card-desc">${b.desc}</div>
      </div>
    `;
    card.addEventListener('click', () => {
      window.open(b.url, '_blank');
    });
    container.appendChild(card);
  });
}

let bookCurrentSpread = 0;
const bookTotalSpreads = BOOK_PAGES.length;
let bookAnimLock = false;

function renderPageContent(page) {
  if (!page) return '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-mute);">·</div>';
  let html = '';
  if (page.chapter) html += '<div class="page-chapter">' + page.chapter + '</div>';
  if (page.title) html += '<div class="page-title">' + page.title + '</div>';
  if (page.eraTag) html += '<div class="page-era-tag" style="background:' + getEraTagColor(page) + '33;color:' + getEraTagColor(page) + 'cc;">' + page.eraTag + '</div>';
  if (page.body) html += '<div class="page-body">' + page.body + '</div>';
  if (page.stats) {
    html += '<div class="page-stats">';
    page.stats.forEach(function(s) {
      html += '<div class="page-stat"><strong>' + s.v + '</strong> ' + s.l + '</div>';
    });
    html += '</div>';
  }
  if (page.quote) {
    html += '<div class="page-quote"><div class="page-quote-text">「' + page.quote.text + '」</div><div class="page-quote-source">— ' + page.quote.source + '</div></div>';
  }
  if (page.annotation) {
    html += '<div class="page-annotation"><div class="page-annotation-label">' + page.annotation.label + '</div><div class="page-annotation-text">' + page.annotation.text + '</div></div>';
  }
  if (page.building) {
    html += '<button class="page-building-link" data-building-id="' + page.building.id + '">' + page.building.name + '</button>';
  }
  if (page.pageNum) {
    html += '<div class="page-num">— ' + page.pageNum + ' —</div>';
  }
  return html;
}

function getEraTagColor(page) {
  var tag = page.eraTag || '';
  if (tag.indexOf('唐') >= 0) return '#c87a3a';
  if (tag.indexOf('五代') >= 0) return '#7a6a4a';
  if (tag.indexOf('辽') >= 0) return '#8a6a3a';
  if (tag.indexOf('宋') >= 0) return '#5a8a4a';
  if (tag.indexOf('金') >= 0) return '#6a5a8a';
  if (tag.indexOf('明') >= 0) return '#b8983a';
  return '#9a7848';
}

function renderBook() {
  const container = document.getElementById('book-pages');
  // Always re-render to ensure correct state
  const baseLeft = document.getElementById('book-base-left');
  const baseRight = document.getElementById('book-base-right');
  container.innerHTML = '';

  // Create all page elements (stacked, z-index by order)
  BOOK_PAGES.forEach((spread, i) => {
    const page = document.createElement('div');
    page.className = 'book-page';
    page.dataset.index = i;
    // Higher pages (later spreads) get lower z-index so earlier pages are on top
    page.style.zIndex = bookTotalSpreads - i;

    // Inner wrapper for 3D transform
    const inner = document.createElement('div');
    inner.className = 'book-page-inner';

    // Front face
    const front = document.createElement('div');
    front.className = 'book-page-face book-page-front';

    if (i === 0) {
      // Cover page
      const spread0 = BOOK_PAGES[0];
      front.innerHTML = `<div class="book-cover" style="height:100%;">
        <div class="book-cover-glyph">${spread0.glyph}</div>
        <div class="book-cover-title">${spread0.title}</div>
        <div class="book-cover-sub">${spread0.sub}</div>
        <div class="book-cover-desc">${spread0.desc}</div>
        <div class="book-cover-seal">山西<br>古建</div>
      </div>`;
    } else {
      // Page i front = spread[i].right
      const thisSpread = BOOK_PAGES[i];
      if (thisSpread && thisSpread.right) {
        if (thisSpread.right.type === 'back-cover') {
          front.innerHTML = `<div class="book-cover" style="height:100%;">
            <div class="book-cover-glyph" style="font-size:3rem;">${thisSpread.right.glyph}</div>
            <div class="book-cover-sub">${thisSpread.right.sub}</div>
            <div class="book-cover-desc" style="margin-top:1rem;">${thisSpread.right.desc}</div>
          </div>`;
        } else {
          front.innerHTML = renderPageContent(thisSpread.right);
        }
      } else {
        front.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-mute);font-family:Cormorant Garamond;font-size:0.8rem;">·</div>';
      }
    }

    // Back face: shows left content of the NEXT spread
    const back = document.createElement('div');
    back.className = 'book-page-face book-page-back';

    if (i < bookTotalSpreads - 1) {
      const nextSpread = BOOK_PAGES[i + 1];
      if (nextSpread.left) {
        back.innerHTML = renderPageContent(nextSpread.left);
      } else if (nextSpread.type === 'cover') {
        back.innerHTML = `<div class="book-cover" style="height:100%;">
          <div class="book-cover-glyph">${nextSpread.glyph}</div>
          <div class="book-cover-title">${nextSpread.title}</div>
          <div class="book-cover-sub">${nextSpread.sub}</div>
          <div class="book-cover-desc">${nextSpread.desc}</div>
          <div class="book-cover-seal">山西<br>古建</div>
        </div>`;
      } else {
        back.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-mute);font-family:Cormorant Garamond;font-size:0.8rem;">·</div>';
      }
    } else {
      // Last page back = back cover
      back.innerHTML = `<div class="book-cover" style="height:100%;">
        <div class="book-cover-glyph" style="font-size:3rem;">終</div>
        <div class="book-cover-sub">FIN</div>
        <div class="book-cover-desc" style="margin-top:1rem;">梁思成《中国建筑史》<br>1932-1944</div>
      </div>`;
    }

    page.appendChild(inner);
    inner.appendChild(front);
    inner.appendChild(back);

    // Bind building links
    page.querySelectorAll('.page-building-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.stopPropagation();
        const buildingId = link.dataset.buildingId;
        const building = BUILDINGS.find(b => b.id === buildingId);
        if (building) window.open(building.url, '_blank');
      });
    });

    // Click to flip this page
    page.addEventListener('click', (e) => {
      if (e.target.classList.contains('page-building-link') || e.target.closest('.page-building-link')) return;
      handlePageClick(i);
    });

    container.appendChild(page);
  });

  updateBookState();
}

function handlePageClick(pageIndex) {
  if (bookAnimLock) return;
  const page = document.querySelector(`.book-page[data-index="${pageIndex}"]`);
  if (!page) return;

  // Temporarily raise z-index during animation
  page.style.zIndex = 999;
  page.classList.add('flipping');
  bookAnimLock = true;

  if (!page.classList.contains('flipped')) {
    // Flip forward
    page.classList.add('flipped');
  } else {
    // Flip backward
    page.classList.remove('flipped');
  }

  setTimeout(() => {
    page.classList.remove('flipping');
    bookAnimLock = false;
    updateBookState();
  }, 900);
}

function updateBookState() {
  // Count flipped pages and adjust z-index
  const allPages = document.querySelectorAll('.book-page');
  let flippedCount = 0;
  
  allPages.forEach((p, idx) => {
    if (p.classList.contains('flipped')) {
      flippedCount++;
      // Flipped pages: most recently flipped on top (higher z-index)
      // The last flipped page should have the highest z-index among flipped
      p.style.zIndex = idx + 1;
    } else {
      // Unflipped pages: first unflipped on top (lower index = higher z-index)
      p.style.zIndex = (bookTotalSpreads - idx) + 100;
    }
  });

  const currentSpreadIndex = flippedCount;

  // Update info
  const infoEl = document.getElementById('book-info');
  infoEl.textContent = `${Math.min(currentSpreadIndex + 1, bookTotalSpreads)} / ${bookTotalSpreads}`;

  // Update buttons
  document.getElementById('book-prev').disabled = currentSpreadIndex === 0;
  document.getElementById('book-next').disabled = currentSpreadIndex >= bookTotalSpreads - 1;
}

document.getElementById('book-prev').addEventListener('click', () => {
  if (bookAnimLock) return;
  // Find the last flipped page and unflip it
  const allPages = Array.from(document.querySelectorAll('.book-page'));
  for (let i = allPages.length - 1; i >= 0; i--) {
    if (allPages[i].classList.contains('flipped')) {
      handlePageClick(parseInt(allPages[i].dataset.index));
      return;
    }
  }
});

document.getElementById('book-next').addEventListener('click', () => {
  if (bookAnimLock) return;
  // Find the first unflipped page and flip it
  const allPages = Array.from(document.querySelectorAll('.book-page'));
  for (let i = 0; i < allPages.length; i++) {
    if (!allPages[i].classList.contains('flipped')) {
      handlePageClick(parseInt(allPages[i].dataset.index));
      return;
    }
  }
});

// ===== Initial render =====
renderMapCities();
</script>
