<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>应县木塔 · 三维交互模型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1410'/%3E<path d='M32 10 L50 22 L50 40 L32 54 L14 40 L14 22 Z' fill='%23c9a84c'/%3E<path d='M22 24 L42 24 M22 30 L42 30 M22 36 L42 36' stroke='%231a1410' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
:root {
  --ink-deep: #1a1410;
  --ink-dark: #2d231a;
  --ink-mid: #3d3328;
  --wood-light: #c4a06a;
  --wood-mid: #9a7848;
  --wood-dark: #6b4e2e;
  --wood-deep: #4a3520;
  --gold: #d4a84b;
  --gold-bright: #e8c878;
  --red-seal: #b8362e;
  --paper: #f5ecd9;
  --paper-dim: #e8dcc4;
  --text-light: #e8dcc4;
  --text-dim: #b0a088;
  --text-mute: #7a6e5a;
  --bg-overlay: rgba(26, 20, 16, 0.92);
  --border-soft: rgba(196, 160, 106, 0.25);
  --border-mid: rgba(196, 160, 106, 0.45);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--ink-deep);
  font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', '宋体', serif;
  color: var(--text-light);
}

#scene-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(ellipse at 50% 70%, #3d3328 0%, #1a1410 60%, #0d0a07 100%);
}

#scene-container::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(circle at 30% 20%, rgba(212, 168, 75, 0.06) 0%, transparent 50%),
    radial-gradient(circle at 70% 80%, rgba(184, 54, 46, 0.04) 0%, transparent 40%);
  pointer-events: none;
  z-index: 1;
}

canvas { display: block; }

/* ===== Loading ===== */
#loader {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--ink-deep);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  transition: opacity 0.8s ease;
}

#loader.hidden { opacity: 0; pointer-events: none; }

.loader-title {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 2.4rem;
  color: var(--gold-bright);
  margin-bottom: 0.5rem;
  letter-spacing: 0.1em;
  text-shadow: 0 0 20px rgba(212, 168, 75, 0.3);
}

.loader-sub {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 0.85rem;
  color: var(--text-mute);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-bottom: 2rem;
}

.loader-bar {
  width: 200px;
  height: 2px;
  background: rgba(196, 160, 106, 0.15);
  border-radius: 1px;
  overflow: hidden;
}

.loader-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--wood-dark), var(--gold), var(--gold-bright));
  width: 0%;
  transition: width 0.3s ease;
  box-shadow: 0 0 8px rgba(212, 168, 75, 0.5);
}

/* ===== Top Bar ===== */
#top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 1.2rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 10;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(26, 20, 16, 0.6) 0%, transparent 100%);
}

.top-left {
  pointer-events: auto;
}

.top-title {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 1.6rem;
  color: var(--gold-bright);
  letter-spacing: 0.08em;
  line-height: 1;
  text-shadow: 0 2px 12px rgba(0,0,0,0.5);
}

.top-sub {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 0.72rem;
  color: var(--text-mute);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-top: 0.3rem;
}

.top-right {
  pointer-events: auto;
  display: flex;
  gap: 0.6rem;
}

.ctrl-btn {
  background: rgba(45, 35, 26, 0.7);
  border: 1px solid var(--border-soft);
  color: var(--text-dim);
  padding: 0.5rem 1rem;
  font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', '宋体', serif;
  font-size: 0.8rem;
  font-weight: 400;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.3s ease;
  backdrop-filter: blur(8px);
  letter-spacing: 0.05em;
}

.ctrl-btn:hover {
  background: rgba(74, 53, 32, 0.8);
  border-color: var(--border-mid);
  color: var(--gold-bright);
}

.ctrl-btn.active {
  background: rgba(107, 78, 46, 0.6);
  border-color: var(--gold);
  color: var(--gold-bright);
}

/* ===== Info Panel ===== */
#info-panel {
  position: fixed;
  top: 50%;
  right: 0;
  transform: translate(100%, -50%);
  width: 420px;
  max-height: 75vh;
  background: var(--bg-overlay);
  backdrop-filter: blur(16px);
  border-left: 1px solid var(--border-mid);
  border-top: 1px solid var(--border-mid);
  border-bottom: 1px solid var(--border-mid);
  border-radius: 4px 0 0 4px;
  padding: 2rem 2.2rem;
  overflow-y: auto;
  z-index: 20;
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: -10px 0 40px rgba(0,0,0,0.4);
}

#info-panel.open {
  transform: translate(0, -50%);
}

#info-panel::-webkit-scrollbar { width: 4px; }
#info-panel::-webkit-scrollbar-track { background: transparent; }
#info-panel::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 2px; }

.panel-close {
  position: absolute;
  top: 1rem; right: 1.2rem;
  width: 28px; height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-mute);
  font-size: 1.2rem;
  transition: color 0.2s;
  background: none;
  border: none;
}

.panel-close:hover { color: var(--gold-bright); }

.panel-tag {
  display: inline-block;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.6rem;
}

.panel-title {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 1.8rem;
  color: var(--gold-bright);
  margin-bottom: 0.3rem;
  line-height: 1.2;
}

.panel-subtitle {
  font-size: 0.82rem;
  color: var(--text-mute);
  margin-bottom: 1.5rem;
  letter-spacing: 0.05em;
}

.panel-divider {
  height: 1px;
  background: linear-gradient(to right, var(--border-mid), transparent);
  margin: 1.2rem 0;
}

.panel-section {
  margin-bottom: 1.2rem;
}

.panel-section-title {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--wood-light);
  margin-bottom: 0.5rem;
  letter-spacing: 0.08em;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.panel-section-title::before {
  content: '';
  width: 3px; height: 12px;
  background: var(--gold);
  border-radius: 1px;
}

.panel-text {
  font-size: 0.88rem;
  line-height: 1.85;
  color: var(--text-dim);
  text-align: justify;
}

.panel-data {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem 1rem;
  margin-top: 0.6rem;
}

.data-item {
  display: flex;
  flex-direction: column;
}

.data-label {
  font-size: 0.7rem;
  color: var(--text-mute);
  letter-spacing: 0.05em;
}

.data-value {
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  font-size: 1.05rem;
  color: var(--gold-bright);
  font-weight: 500;
}

/* ===== Bottom Bar ===== */
#bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 1rem 2rem 1.5rem;
  z-index: 10;
  pointer-events: none;
  background: linear-gradient(to top, rgba(26, 20, 16, 0.7) 0%, transparent 100%);
}

.layer-selector {
  display: flex;
  justify-content: center;
  gap: 0.4rem;
  pointer-events: auto;
  flex-wrap: wrap;
}

.layer-chip {
  background: rgba(45, 35, 26, 0.7);
  border: 1px solid var(--border-soft);
  color: var(--text-dim);
  padding: 0.45rem 1rem;
  font-size: 0.78rem;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.3s ease;
  backdrop-filter: blur(8px);
  font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', '宋体', serif;
  white-space: nowrap;
}

.layer-chip:hover {
  background: rgba(74, 53, 32, 0.8);
  color: var(--gold-bright);
  border-color: var(--border-mid);
}

.layer-chip.active {
  background: rgba(107, 78, 46, 0.5);
  border-color: var(--gold);
  color: var(--gold-bright);
}

.hint-text {
  text-align: center;
  font-size: 0.7rem;
  color: var(--text-mute);
  margin-top: 0.8rem;
  letter-spacing: 0.1em;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  text-transform: uppercase;
}

/* ===== Tooltip ===== */
#tooltip {
  position: fixed;
  pointer-events: none;
  background: rgba(26, 20, 16, 0.92);
  border: 1px solid var(--border-mid);
  padding: 0.4rem 0.8rem;
  font-size: 0.78rem;
  color: var(--gold-bright);
  border-radius: 2px;
  z-index: 50;
  opacity: 0;
  transition: opacity 0.2s ease;
  white-space: nowrap;
  backdrop-filter: blur(8px);
}

#tooltip.visible { opacity: 1; }

/* ===== Exploded Toggle ===== */
.explode-status {
  position: fixed;
  bottom: 5rem;
  left: 2rem;
  z-index: 10;
  font-size: 0.72rem;
  color: var(--text-mute);
  letter-spacing: 0.1em;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  text-transform: uppercase;
  opacity: 0;
  transition: opacity 0.3s;
}

.explode-status.visible { opacity: 1; }

/* ===== Corner Decoration ===== */
.corner-deco {
  position: fixed;
  width: 60px; height: 60px;
  pointer-events: none;
  z-index: 5;
  opacity: 0.3;
}

.corner-deco.tl { top: 0; left: 0; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); }
.corner-deco.tr { top: 0; right: 0; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); }
.corner-deco.bl { bottom: 0; left: 0; border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); }
.corner-deco.br { bottom: 0; right: 0; border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); }

@media (max-width: 768px) {
  #info-panel { width: 90%; }
  .top-title { font-size: 1.2rem; }
  .layer-chip { font-size: 0.7rem; padding: 0.35rem 0.7rem; }
}
</style>
</head>
<body>

<div id="scene-container"></div>

<div class="corner-deco tl"></div>
<div class="corner-deco tr"></div>
<div class="corner-deco bl"></div>
<div class="corner-deco br"></div>

<!-- Loading -->
<div id="loader">
  <div class="loader-title">应县木塔</div>
  <div class="loader-sub">Sakyamuni Pagoda · 1056 AD</div>
  <div class="loader-bar"><div class="loader-bar-fill" id="loader-fill"></div></div>
</div>

<!-- Top Bar -->
<div id="top-bar">
  <div class="top-left">
    <div class="top-title">应县木塔</div>
    <div class="top-sub">Fogong Temple · Sakyamuni Pagoda</div>
  </div>
  <div class="top-right">
    <button class="ctrl-btn" id="btn-explode">拆解视图</button>
    <button class="ctrl-btn" id="btn-reset">重置视角</button>
    <button class="ctrl-btn" id="btn-auto">自动旋转</button>
  </div>
</div>

<!-- Info Panel -->
<div id="info-panel">
  <button class="panel-close" id="panel-close">✕</button>
  <div id="panel-content"></div>
</div>

<!-- Bottom Bar -->
<div id="bottom-bar">
  <div class="layer-selector" id="layer-selector"></div>
  <div class="hint-text">点击塔身各部分查看详情 · 拖拽旋转 · 滚轮缩放</div>
</div>

<div class="explode-status" id="explode-status">EXPLODED VIEW: ON</div>

<!-- Tooltip -->
<div id="tooltip"></div>

<script type="importmap">

    "three": "../three-lib/three/three.module.js",

// Create octagonal geometry helper
function createOctagon(radius, height, segments = 1) {
  const shape = new THREE.Shape();
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 - Math.PI / 2;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    if (i === 0) shape.moveTo(x, z);
    else shape.lineTo(x, z);
  }
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: height,
    bevelEnabled: false,
    curveSegments: 1,
  });
  geo.rotateX(-Math.PI / 2);
  return geo;
}

// Create octagonal ring (for eaves/roofs)
function createOctagonalRoof(radius, innerRadius, height, tilt = 0.35) {
  const group = new THREE.Group();
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 - Math.PI / 2 + Math.PI / 8;
    const nextAngle = angle + Math.PI / 4;

    // Roof slope segment
    const w = radius * 0.78;
    const h = height + tilt * radius * 0.5;

    const slopeGeo = new THREE.BufferGeometry();
    const r1 = innerRadius;
    const r2 = radius;
    const vertices = new Float32Array([
      Math.cos(angle) * r1, 0, Math.sin(angle) * r1,
      Math.cos(nextAngle) * r1, 0, Math.sin(nextAngle) * r1,
      Math.cos(nextAngle) * r2, h, Math.sin(nextAngle) * r2,
      Math.cos(angle) * r1, 0, Math.sin(angle) * r1,
      Math.cos(nextAngle) * r2, h, Math.sin(nextAngle) * r2,
      Math.cos(angle) * r2, h, Math.sin(angle) * r2,
    ]);
    slopeGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    slopeGeo.computeVertexNormals();

    const slopeMesh = new THREE.Mesh(slopeGeo, woodMaterials.roof);
    slopeMesh.castShadow = true;
    slopeMesh.receiveShadow = true;
    group.add(slopeMesh);
  }

  // Eave edge (decorative line)
  const edgeGeo = new THREE.TorusGeometry(radius * 0.96, 0.15, 6, 8);
  const edgeMesh = new THREE.Mesh(edgeGeo, woodMaterials.dark);
  edgeMesh.rotation.x = Math.PI / 2;
  edgeMesh.position.y = height;
  group.add(edgeMesh);

  return group;
}

// Create dougong ring
function createDougongRing(radius, y) {
  const group = new THREE.Group();
  const count = 24;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;

    // Bracket block
    const blockGeo = new THREE.BoxGeometry(0.8, 0.5, 0.6);
    const block = new THREE.Mesh(blockGeo, woodMaterials.mid);
    block.position.set(x, y, z);
    block.lookAt(0, y, 0);
    block.castShadow = true;
    group.add(block);

    // Arms extending outward
    const armGeo = new THREE.BoxGeometry(0.3, 0.25, 0.9);
    const arm = new THREE.Mesh(armGeo, woodMaterials.light);
    arm.position.set(
      Math.cos(angle) * (radius + 0.4),
      y + 0.1,
      Math.sin(angle) * (radius + 0.4)
    );
    arm.lookAt(
      Math.cos(angle) * (radius + 1),
      y + 0.1,
      Math.sin(angle) * (radius + 1)
    );
    arm.castShadow = true;
    group.add(arm);

    // Upper block
    const upperGeo = new THREE.BoxGeometry(0.6, 0.4, 0.5);
    const upper = new THREE.Mesh(upperGeo, woodMaterials.dark);
    upper.position.set(
      Math.cos(angle) * (radius + 0.2),
      y + 0.45,
      Math.sin(angle) * (radius + 0.2)
    );
    upper.lookAt(0, y + 0.45, 0);
    upper.castShadow = true;
    group.add(upper);
  }
  return group;
}

// Create column ring
function createColumnRing(radius, height, y, columnCount = 24) {
  const group = new THREE.Group();
  for (let i = 0; i < columnCount; i++) {
    const angle = (i / columnCount) * Math.PI * 2;
    const colGeo = new THREE.CylinderGeometry(0.35, 0.4, height, 8);
    const col = new THREE.Mesh(colGeo, woodMaterials.mid);
    col.position.set(
      Math.cos(angle) * radius,
      y + height / 2,
      Math.sin(angle) * radius
    );
    col.castShadow = true;
    col.receiveShadow = true;
    group.add(col);
  }

  // Inner columns (8)
  const innerRadius = radius * 0.5;
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const colGeo = new THREE.CylinderGeometry(0.4, 0.45, height, 8);
    const col = new THREE.Mesh(colGeo, woodMaterials.dark);
    col.position.set(
      Math.cos(angle) * innerRadius,
      y + height / 2,
      Math.sin(angle) * innerRadius
    );
    col.castShadow = true;
    group.add(col);
  }

  return group;
}

// Create wall/facade between columns
function createWallRing(radius, height, y, opacity = 1) {
  const group = new THREE.Group();
  for (let i = 0; i < 8; i++) {
    const angle1 = (i / 8) * Math.PI * 2 - Math.PI / 2;
    const angle2 = ((i + 1) / 8) * Math.PI * 2 - Math.PI / 2;

    const x1 = Math.cos(angle1) * radius;
    const z1 = Math.sin(angle1) * radius;
    const x2 = Math.cos(angle2) * radius;
    const z2 = Math.sin(angle2) * radius;

    const midAngle = (angle1 + angle2) / 2;
    const midRadius = radius * 0.98;

    const w = Math.sqrt((x2 - x1) ** 2 + (z2 - z1) ** 2);
    const wallGeo = new THREE.BoxGeometry(w * 0.9, height * 0.7, 0.15);
    const wallMat = woodMaterials.mid.clone();
    wallMat.transparent = opacity < 1;
    wallMat.opacity = opacity;
    const wall = new THREE.Mesh(wallGeo, wallMat);
    wall.position.set(
      Math.cos(midAngle) * midRadius,
      y + height * 0.35,
      Math.sin(midAngle) * midRadius
    );
    wall.lookAt(0, y + height * 0.35, 0);
    wall.castShadow = true;
    wall.receiveShadow = true;
    group.add(wall);
  }
  return group;
}

// Create floor
function createFloor(radius, y) {
  const geo = createOctagon(radius, 0.2);
  const mesh = new THREE.Mesh(geo, woodMaterials.dark);
  mesh.position.y = y;
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  return mesh;
}

// 1. BASE (塔基)
function buildBase() {
  const group = new THREE.Group();
  group.userData = { partId: 'base', explodeY: -2 };

  const lowerBaseGeo = new THREE.BoxGeometry(36, 2.5, 36);

  lowerBase.castShadow = true;
  lowerBase.receiveShadow = true;
  lowerBase.userData = { partId: 'base' };
  group.add(lowerBase);

  // Upper base (octagonal)
  const upperBaseGeo = createOctagon(16, 1.8);
  const upperBase = new THREE.Mesh(upperBaseGeo, woodMaterials.base);
  upperBase.position.y = 3.4;
  upperBase.castShadow = true;
  upperBase.receiveShadow = true;
  upperBase.userData = { partId: 'base' };
  group.add(upperBase);

  // Base steps
  for (let i = 0; i < 4; i++) {
    const stepGeo = new THREE.BoxGeometry(8 - i * 1.5, 0.3, 6 - i * 1);
    const step = new THREE.Mesh(stepGeo, woodMaterials.stone);
    step.position.set(0, 2.5 + i * 0.3, 10);
    step.castShadow = true;
    step.userData = { partId: 'base' };
    group.add(step);
  }

  partMeshes.push(...group.children);
  return group;
}

// 2. LAYER (明层)
function buildLayer(layerIndex, radius, height, y, isBottom = false) {
  const group = new THREE.Group();
  const partId = `layer${layerIndex}`;
  group.userData = { partId, explodeY: (layerIndex - 1) * 5 };

  // Floor
  const floor = createFloor(radius, y);
  floor.userData = { partId };
  group.add(floor);

  // Columns
  const colHeight = height * 0.55;
  const cols = createColumnRing(radius * 0.95, colHeight, y + 0.2);
  cols.traverse(c => { if (c.isMesh) c.userData = { partId }; });
  group.add(cols);

  // Walls (with door openings)
  const walls = createWallRing(radius * 0.93, colHeight, y + 0.2, 0.85);
  walls.traverse(c => { if (c.isMesh) c.userData = { partId }; });
  group.add(walls);

  // Dougong
  const dougong = createDougongRing(radius * 0.96, y + colHeight + 0.3);
  dougong.traverse(c => { if (c.isMesh) c.userData = { partId: 'dougong' }; });
  group.add(dougong);

  // Roof/eaves
  const roofHeight = height * 0.25;
  const roof = createOctagonalRoof(radius * 1.15, radius * 0.9, roofHeight, 0.3);
  roof.position.y = y + colHeight + 0.6;
  roof.traverse(c => { if (c.isMesh) c.userData = { partId: 'roof' }; });
  group.add(roof);

  // Inner shrine platform
  const platformGeo = new THREE.CylinderGeometry(radius * 0.25, radius * 0.28, 0.5, 8);
  const platform = new THREE.Mesh(platformGeo, woodMaterials.dark);
  platform.position.y = y + 0.45;
  platform.castShadow = true;
  platform.userData = { partId };
  group.add(platform);

  // Buddha figure (simplified)
  const buddhaGeo = new THREE.CylinderGeometry(0.6, 0.8, layerIndex === 1 ? 3.5 : 2, 12);
  const buddhaMat = woodMaterials.goldBright.clone();
  buddhaMat.emissive = new THREE.Color(0xd4a84b);
  buddhaMat.emissiveIntensity = 0.1;
  const buddha = new THREE.Mesh(buddhaGeo, buddhaMat);
  buddha.position.y = y + 0.7 + (layerIndex === 1 ? 1.75 : 1);
  buddha.castShadow = true;
  buddha.userData = { partId };
  group.add(buddha);

  // Buddha head
  const headGeo = new THREE.SphereGeometry(0.5, 12, 8);
  const head = new THREE.Mesh(headGeo, buddhaMat);
  head.position.y = buddha.position.y + (layerIndex === 1 ? 1.75 : 1) + 0.3;
  head.castShadow = true;
  head.userData = { partId };
  group.add(head);

  // Balcony railing (for upper layers)
  if (layerIndex > 1) {
    const railingHeight = 0.6;
    for (let i = 0; i < 8; i++) {
      const angle1 = (i / 8) * Math.PI * 2 - Math.PI / 2;
      const angle2 = ((i + 1) / 8) * Math.PI * 2 - Math.PI / 2;
      const x1 = Math.cos(angle1) * radius * 1.1;
      const z1 = Math.sin(angle1) * radius * 1.1;
      const x2 = Math.cos(angle2) * radius * 1.1;
      const z2 = Math.sin(angle2) * radius * 1.1;
      const w = Math.sqrt((x2 - x1) ** 2 + (z2 - z1) ** 2);
      const railGeo = new THREE.BoxGeometry(w * 0.85, railingHeight, 0.1);
      const rail = new THREE.Mesh(railGeo, woodMaterials.light);
      const midAngle = (angle1 + angle2) / 2;
      rail.position.set(
        Math.cos(midAngle) * radius * 1.1,
        y + colHeight + 0.1,
        Math.sin(midAngle) * radius * 1.1
      );
      rail.lookAt(0, y + colHeight + 0.1, 0);
      rail.castShadow = true;
      rail.userData = { partId };
      group.add(rail);
    }
  }

  // Bottom layer: additional skirt roof (重檐)
  if (isBottom) {
    const skirtRoof = createOctagonalRoof(radius * 1.3, radius * 1.05, 1.2, 0.4);
    skirtRoof.position.y = y + colHeight + 0.1;
    skirtRoof.traverse(c => { if (c.isMesh) c.userData = { partId: 'roof' }; });
    group.add(skirtRoof);
  }

  // Collect meshes
  group.traverse(c => {
    if (c.isMesh) {
      c.userData.originalPos = c.position.clone();
      c.userData.originalParentPos = new THREE.Vector3();
      partMeshes.push(c);
    }
  });

  return group;
}

  lotus.castShadow = true;

  y += 0.6;

  // Petals
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const petalGeo = new THREE.SphereGeometry(0.35, 6, 4, 0, Math.PI * 2, 0, Math.PI / 2);
    const petal = new THREE.Mesh(petalGeo, woodMaterials.goldBright);
    petal.position.set(
      Math.cos(angle) * 1.3,
      y,
      Math.sin(angle) * 1.3
    );
    petal.scale.set(1, 1.5, 0.5);
    petal.castShadow = true;
    petal.userData = { partId: 'steeple' };
    group.add(petal);
  }
  y += 0.3;

  // Xianglun (相轮) - 5 discs
  for (let i = 0; i < 5; i++) {
    const r = 0.9 - i * 0.12;
    const discGeo = new THREE.CylinderGeometry(r, r, 0.25, 8);
    const disc = new THREE.Mesh(discGeo, woodMaterials.iron);
    disc.position.y = y + 0.15 + i * 0.35;
    disc.castShadow = true;
    disc.userData = { partId: 'steeple' };
    group.add(disc);
  }
  y += 5 * 0.35 + 0.15;

  // Yanguang (圆光) - sphere
  const sphereGeo = new THREE.SphereGeometry(0.5, 12, 8);
  const sphere = new THREE.Mesh(sphereGeo, woodMaterials.goldBright);
  sphere.position.y = y + 0.3;
  sphere.castShadow = true;
  sphere.userData = { partId: 'steeple' };
  group.add(sphere);
  y += 0.6;

  // Yangyue (仰月) - crescent
  const moonGeo = new THREE.TorusGeometry(0.6, 0.08, 6, 12, Math.PI);
  const moon = new THREE.Mesh(moonGeo, woodMaterials.gold);
  moon.position.y = y + 0.1;
  moon.rotation.x = Math.PI;
  moon.castShadow = true;
  moon.userData = { partId: 'steeple' };
  group.add(moon);
  y += 0.3;

  // Baogai (宝盖) - cone
  const canopyGeo = new THREE.ConeGeometry(0.8, 0.6, 8);
  const canopy = new THREE.Mesh(canopyGeo, woodMaterials.iron);
  canopy.position.y = y + 0.3;
  canopy.castShadow = true;
  canopy.userData = { partId: 'steeple' };
  group.add(canopy);
  y += 0.6;

  // Baozhu (宝珠) - top sphere
  const jewelGeo = new THREE.SphereGeometry(0.4, 12, 8);
  const jewel = new THREE.Mesh(jewelGeo, woodMaterials.goldBright);
  jewel.position.y = y + 0.4;
  jewel.castShadow = true;
  jewel.userData = { partId: 'steeple' };
  group.add(jewel);

  // Spike
  const spikeGeo = new THREE.ConeGeometry(0.08, 0.6, 6);
  const spike = new THREE.Mesh(spikeGeo, woodMaterials.gold);
  spike.position.y = y + 0.9;
  spike.castShadow = true;
  spike.userData = { partId: 'steeple' };
  group.add(spike);

  group.traverse(c => {
    if (c.isMesh) {
      c.userData.originalPos = c.position.clone();
      partMeshes.push(c);
    }
  });

  return group;
}

// Assemble the pagoda
const base = buildBase();
pagodaGroup.add(base);

const layerConfigs = [
  { index: 1, radius: 14, height: 11, y: 4.3, isBottom: true },
  { index: 2, radius: 12.5, height: 9, y: 17 },
  { index: 3, radius: 11, height: 8, y: 27 },
  { index: 4, radius: 9.5, height: 7.5, y: 36 },
  { index: 5, radius: 8, height: 7, y: 44.5 },
];

layerConfigs.forEach(cfg => {
  const layer = buildLayer(cfg.index, cfg.radius, cfg.height, cfg.y, cfg.isBottom);
  pagodaGroup.add(layer);
});

// Steeple on top
const steeple = buildSteeple(52);
pagodaGroup.add(steeple);

scene.add(pagodaGroup);

// Store original positions for all meshes
partMeshes.forEach(mesh => {
  if (!mesh.userData.originalPos) {
    mesh.userData.originalPos = mesh.position.clone();
  }
  // Store world position
  const worldPos = new THREE.Vector3();
  mesh.getWorldPosition(worldPos);
  mesh.userData.originalWorldPos = worldPos.clone();
});

// ===== Interaction =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredPart = null;
let selectedPart = null;
const tooltip = document.getElementById('tooltip');

function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(partMeshes, false);

  if (intersects.length > 0) {
    const partId = intersects[0].object.userData.partId;
    if (partId) {
      const partData = PAGODA_DATA.parts.find(p => p.id === partId);
      if (partData) {
        hoveredPart = partId;
        tooltip.textContent = partData.name;
        tooltip.style.left = (event.clientX + 15) + 'px';
        tooltip.style.top = (event.clientY + 10) + 'px';
        tooltip.classList.add('visible');
        document.body.style.cursor = 'pointer';
        return;
      }
    }
  }

  hoveredPart = null;
  tooltip.classList.remove('visible');
  document.body.style.cursor = 'default';
}

function onClick(event) {
  if (event.target.closest('#info-panel') || event.target.closest('#top-bar') || event.target.closest('#bottom-bar')) return;

  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(partMeshes, false);

  if (intersects.length > 0) {
    const partId = intersects[0].object.userData.partId;
    if (partId) {
      selectPart(partId);
    }
  }
}

function selectPart(partId) {
  selectedPart = partId;
  const partData = PAGODA_DATA.parts.find(p => p.id === partId);
  if (!partData) return;

  // Build panel content
  let html = `
    <div class="panel-tag">${partData.tag}</div>
    <div class="panel-title">${partData.name}</div>
    <div class="panel-subtitle">${partData.subtitle}</div>
    <div class="panel-divider"></div>
    <div class="panel-section">
      <div class="panel-section-title">详细介绍</div>
      <div class="panel-text">${partData.description}</div>
    </div>
  `;

  if (partData.data && partData.data.length > 0) {
    html += `<div class="panel-section">
      <div class="panel-section-title">关键数据</div>
      <div class="panel-data">`;
    partData.data.forEach(d => {
      html += `<div class="data-item"><div class="data-label">${d.label}</div><div class="data-value">${d.value}</div></div>`;
    });
    html += `</div></div>`;
  }

  if (partData.facts && partData.facts.length > 0) {
    html += `<div class="panel-section">
      <div class="panel-section-title">要点</div>
      <div class="panel-text">`;
    partData.facts.forEach(f => {
      html += `• ${f}<br>`;
    });
    html += `</div></div>`;
  }

  document.getElementById('panel-content').innerHTML = html;
  document.getElementById('info-panel').classList.add('open');

  // Highlight selected part
  highlightPart(partId);

  // Update layer selector
  document.querySelectorAll('.layer-chip').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.partId === partId);
  });
}

function highlightPart(partId) {
  partMeshes.forEach(mesh => {
    if (mesh.userData.partId === partId) {
      if (!mesh.userData.savedMaterial) {
        mesh.userData.savedMaterial = mesh.material;
      }
      mesh.material = highlightMat;
    } else {
      if (mesh.userData.savedMaterial) {
        mesh.material = mesh.userData.savedMaterial;
        delete mesh.userData.savedMaterial;
      }
    }
  });
}

function clearHighlight() {
  partMeshes.forEach(mesh => {
    if (mesh.userData.savedMaterial) {
      mesh.material = mesh.userData.savedMaterial;
      delete mesh.userData.savedMaterial;
    }
  });
}

renderer.domElement.addEventListener('mousemove', onMouseMove);
renderer.domElement.addEventListener('click', onClick);

// ===== Controls =====
document.getElementById('panel-close').addEventListener('click', () => {
  document.getElementById('info-panel').classList.remove('open');
  clearHighlight();
  selectedPart = null;
  document.querySelectorAll('.layer-chip').forEach(chip => chip.classList.remove('active'));
});

document.getElementById('btn-explode').addEventListener('click', () => {
  exploded = !exploded;
  explodeTarget = exploded ? 1 : 0;
  document.getElementById('btn-explode').classList.toggle('active', exploded);
  document.getElementById('explode-status').classList.toggle('visible', exploded);
  document.getElementById('explode-status').textContent = exploded ? 'EXPLODED VIEW: ON' : '';
});

document.getElementById('btn-reset').addEventListener('click', () => {
  camera.position.set(55, 35, 55);
  controls.target.set(0, 18, 0);
  controls.update();
});

document.getElementById('btn-auto').addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  document.getElementById('btn-auto').classList.toggle('active', controls.autoRotate);
});

// Layer selector chips
const layerSelector = document.getElementById('layer-selector');
PAGODA_DATA.parts.forEach(part => {
  const chip = document.createElement('div');
  chip.className = 'layer-chip';
  chip.textContent = part.name;
  chip.dataset.partId = part.id;
  chip.addEventListener('click', () => selectPart(part.id));
  layerSelector.appendChild(chip);
});

// ===== Explode Animation =====
function updateExplode() {
  const speed = 0.04;
  if (Math.abs(explodeProgress - explodeTarget) < 0.001) {
    explodeProgress = explodeTarget;
  } else {
    explodeProgress += (explodeTarget - explodeProgress) * speed;
  }

  if (explodeProgress > 0.001 || explodeTarget > 0) {
    const t = explodeProgress;
    // Vertical explode distances per part
    const explodeOffsets = {
      'base': -3 * t,
      'layer1': 0,
      'layer2': 4 * t,
      'layer3': 8 * t,
      'layer4': 12 * t,
      'layer5': 16 * t,
      'roof': 0,
      'dougong': 2 * t,
      'steeple': 22 * t,
    };

    partMeshes.forEach(mesh => {
      const partId = mesh.userData.partId;
      const offset = explodeOffsets[partId] || 0;
      if (mesh.userData.originalPos) {
        mesh.position.y = mesh.userData.originalPos.y + offset;
      }

      // Slight horizontal spread for dougong
      if (partId === 'dougong' && explodeProgress > 0) {
        const dir = mesh.position.clone();
        dir.y = 0;
        dir.normalize().multiplyScalar(1.5 * t);
        mesh.position.x = mesh.userData.originalPos.x + dir.x;
        mesh.position.z = mesh.userData.originalPos.z + dir.z;
      }
    });
  }
}

// ===== Animation Loop =====
function animate() {
  requestAnimationFrame(animate);
  updateExplode();
  controls.update();
  renderer.render(scene, camera);
}

// ===== Resize =====
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===== Load Progress =====
let loadProgress = 0;
const loadInterval = setInterval(() => {
  loadProgress += Math.random() * 20;
  if (loadProgress >= 100) {
    loadProgress = 100;
    clearInterval(loadInterval);
    setTimeout(() => {
      document.getElementById('loader').classList.add('hidden');
      animate();
    }, 400);
  }
  document.getElementById('loader-fill').style.width = loadProgress + '%';
}, 80);

// Start animation immediately (behind loader)
window.THREE = THREE;
window.scene = scene;
window.camera = camera;
window.renderer = renderer;
animate();

</script>
