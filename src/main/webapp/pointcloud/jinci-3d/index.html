<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晋祠圣母殿 · 三维交互模型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --wood-light: #c4a26a;
    --wood-mid: #a07840;
    --wood-dark: #6b4a20;
    --wood-darker: #3d2810;
    --roof-tile: #2d3a2e;
    --roof-tile-light: #4a5a4e;
    --stone-base: #b8b0a0;
    --stone-dark: #8a8278;
    --accent-red: #a83820;
    --accent-gold: #d4a050;
    --bg-gradient: linear-gradient(180deg, #1a1410 0%, #2a1f15 50%, #3d2e1e 100%);
    --panel-bg: rgba(30, 22, 14, 0.92);
    --panel-border: rgba(196, 162, 106, 0.35);
    --text-primary: #e8d8c0;
    --text-secondary: #b8a888;
    --text-muted: #8a7860;
  }
  
  body {
    overflow: hidden;
    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    background: var(--bg-gradient);
    color: var(--text-primary);
    user-select: none;
  }
  
  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
  }
  
  /* ===== Loading Screen ===== */
  #loading-screen {
    position: fixed;
    inset: 0;
    background: var(--bg-gradient);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.8s ease;
  }
  
  #loading-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }
  
  .loading-title {
    font-size: 2.2rem;
    font-weight: 300;
    letter-spacing: 0.5rem;
    color: var(--accent-gold);
    margin-bottom: 1.5rem;
    text-shadow: 0 0 20px rgba(212, 160, 80, 0.3);
  }
  
  .loading-subtitle {
    font-size: 0.9rem;
    color: var(--text-muted);
    letter-spacing: 0.3rem;
    margin-bottom: 2rem;
  }
  
  .loading-bar-container {
    width: 300px;
    height: 3px;
    background: rgba(196, 162, 106, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  
  .loading-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--wood-mid), var(--accent-gold));
    border-radius: 2px;
    transition: width 0.3s ease;
    box-shadow: 0 0 10px rgba(212, 160, 80, 0.5);
  }
  
  .loading-percent {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.8rem;
    font-family: monospace;
  }
  
  /* ===== Top Bar ===== */
  #top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    z-index: 100;
    background: linear-gradient(180deg, rgba(30, 22, 14, 0.85) 0%, rgba(30, 22, 14, 0) 100%);
    pointer-events: none;
  }
  
  .top-title {
    font-size: 1.4rem;
    font-weight: 400;
    letter-spacing: 0.3rem;
    color: var(--accent-gold);
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    pointer-events: auto;
  }
  
  .top-subtitle {
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.15rem;
    pointer-events: auto;
  }
  
  /* ===== Control Buttons ===== */
  #controls {
    position: fixed;
    top: 80px;
    right: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    z-index: 100;
  }
  
  .ctrl-btn {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    backdrop-filter: blur(8px);
    font-size: 0.7rem;
    letter-spacing: 0.05rem;
    font-family: inherit;
  }
  
  .ctrl-btn:hover {
    background: rgba(60, 44, 28, 0.95);
    border-color: var(--accent-gold);
    color: var(--accent-gold);
    transform: translateX(-3px);
  }
  
  .ctrl-btn.active {
    background: rgba(168, 56, 32, 0.3);
    border-color: var(--accent-red);
    color: var(--accent-gold);
  }
  
  .ctrl-btn svg {
    width: 22px;
    height: 22px;
  }
  
  .ctrl-btn .btn-label {
    font-size: 0.65rem;
    writing-mode: vertical-rl;
    letter-spacing: 0.1rem;
  }
  
  /* ===== Info Panel ===== */
  #info-panel {
    position: fixed;
    top: 50%;
    left: 1.5rem;
    transform: translateY(-50%) translateX(-110%);
    width: 380px;
    max-height: 75vh;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    backdrop-filter: blur(12px);
    z-index: 200;
    overflow-y: auto;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  
  #info-panel.visible {
    transform: translateY(-50%) translateX(0);
  }
  
  #info-panel::-webkit-scrollbar {
    width: 5px;
  }
  #info-panel::-webkit-scrollbar-track {
    background: transparent;
  }
  #info-panel::-webkit-scrollbar-thumb {
    background: var(--wood-mid);
    border-radius: 3px;
  }
  
  .panel-header {
    padding: 1.5rem 1.5rem 0.8rem;
    position: relative;
  }
  
  .panel-close {
    position: absolute;
    top: 1rem;
    right: 1rem;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(168, 56, 32, 0.2);
    border: 1px solid var(--panel-border);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  
  .panel-close:hover {
    background: rgba(168, 56, 32, 0.4);
    color: var(--text-primary);
  }
  
  .panel-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.8rem;
    font-size: 1.3rem;
  }
  
  .panel-title {
    font-size: 1.3rem;
    font-weight: 500;
    color: var(--accent-gold);
    letter-spacing: 0.1rem;
    margin-bottom: 0.3rem;
  }
  
  .panel-subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.1rem;
  }
  
  .panel-body {
    padding: 0 1.5rem 1.5rem;
  }
  
  .panel-section {
    margin-top: 1.2rem;
    padding-top: 1.2rem;
    border-top: 1px solid rgba(196, 162, 106, 0.12);
  }
  
  .panel-section-title {
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.2rem;
    margin-bottom: 0.6rem;
    text-transform: uppercase;
  }
  
  .panel-text {
    font-size: 0.9rem;
    line-height: 1.8;
    color: var(--text-primary);
    letter-spacing: 0.02rem;
  }
  
  .panel-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.8rem;
  }
  
  .stat-item {
    background: rgba(196, 162, 106, 0.06);
    border-radius: 8px;
    padding: 0.7rem 0.9rem;
  }
  
  .stat-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-bottom: 0.2rem;
  }
  
  .stat-value {
    font-size: 1.05rem;
    color: var(--accent-gold);
    font-weight: 500;
  }
  
  .panel-tag {
    display: inline-block;
    padding: 0.2rem 0.7rem;
    border-radius: 4px;
    font-size: 0.72rem;
    margin-right: 0.4rem;
    margin-bottom: 0.4rem;
    background: rgba(168, 56, 32, 0.15);
    color: var(--accent-red);
    border: 1px solid rgba(168, 56, 32, 0.2);
  }
  
  .panel-tag.gold {
    background: rgba(212, 160, 80, 0.12);
    color: var(--accent-gold);
    border-color: rgba(212, 160, 80, 0.2);
  }
  
  /* ===== Bottom Layer Selector ===== */
  #layer-selector {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0 1rem;
    z-index: 100;
    background: linear-gradient(0deg, rgba(30, 22, 14, 0.9) 0%, rgba(30, 22, 14, 0) 100%);
  }
  
  .layer-btn {
    padding: 0.5rem 1rem;
    border-radius: 8px;
    background: rgba(30, 22, 14, 0.7);
    border: 1px solid var(--panel-border);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 0.8rem;
    letter-spacing: 0.05rem;
    transition: all 0.25s ease;
    backdrop-filter: blur(8px);
    font-family: inherit;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  
  .layer-btn:hover {
    background: rgba(60, 44, 28, 0.9);
    color: var(--text-primary);
    border-color: var(--wood-mid);
  }
  
  .layer-btn.active {
    background: rgba(168, 56, 32, 0.25);
    border-color: var(--accent-red);
    color: var(--accent-gold);
  }
  
  .layer-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  
  /* ===== Tooltip ===== */
  #tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 300;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 0.5rem 0.9rem;
    font-size: 0.82rem;
    color: var(--text-primary);
    letter-spacing: 0.05rem;
    backdrop-filter: blur(8px);
    opacity: 0;
    transition: opacity 0.15s ease;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  
  #tooltip.visible {
    opacity: 1;
  }
  
  .tooltip-name {
    color: var(--accent-gold);
    font-weight: 500;
  }
  
  .tooltip-hint {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 0.15rem;
  }
  
  /* ===== Explode Slider ===== */
  #explode-control {
    position: fixed;
    bottom: 85px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 0.8rem;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 0.5rem 1.2rem;
    backdrop-filter: blur(8px);
    z-index: 100;
  }
  
  #explode-control.visible {
    display: flex;
  }
  
  .explode-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    letter-spacing: 0.1rem;
    white-space: nowrap;
  }
  
  #explode-slider {
    width: 200px;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: rgba(196, 162, 106, 0.2);
    outline: none;
  }
  
  #explode-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent-gold);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(212, 160, 80, 0.4);
  }
  
  #explode-slider::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent-gold);
    cursor: pointer;
    border: none;
  }
  
  .explode-value {
    font-size: 0.75rem;
    color: var(--accent-gold);
    font-family: monospace;
    min-width: 35px;
    text-align: right;
  }
  
  /* ===== Hint ===== */
  #hint {
    position: fixed;
    bottom: 85px;
    right: 1.5rem;
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 0.08rem;
    z-index: 50;
    pointer-events: none;
    text-align: right;
    line-height: 1.6;
  }
  
  /* ===== Compass ===== */
  #compass {
    position: fixed;
    bottom: 85px;
    left: 1.5rem;
    width: 60px;
    height: 60px;
    z-index: 50;
    pointer-events: none;
  }
  
  @media (max-width: 768px) {
    #info-panel {
      width: calc(100vw - 2rem);
      left: 1rem;
      max-height: 60vh;
    }
    .top-title { font-size: 1rem; }
    .top-subtitle { display: none; }
    .layer-btn { padding: 0.4rem 0.6rem; font-size: 0.72rem; }
    #controls { top: 70px; right: 0.8rem; }
    .ctrl-btn { width: 42px; height: 42px; }
    #hint { display: none; }
    #compass { display: none; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "../three-lib/three/three.module.js",
    "three/addons/": "../three-lib/three/addons/"
  }
}
</script>
</head>
<body>

<!-- Loading Screen -->
<div id="loading-screen">
  <div class="loading-title">晋祠聖母殿</div>
  <div class="loading-subtitle">JINCI SHENGDIA HALL · 3D MODEL</div>
  <div class="loading-bar-container">
    <div class="loading-bar" id="loading-bar"></div>
  </div>
  <div class="loading-percent" id="loading-percent">0%</div>
</div>

<!-- Top Bar -->
<div id="top-bar">
  <div>
    <div class="top-title">晉祠聖母殿</div>
    <div class="top-subtitle">北宋 · 太原晉源 · 第一批全國重點文物保護單位</div>
  </div>
  <div class="top-subtitle" style="text-align:right;">
    坐西朝東 · 面闊七間 · 進深六間<br>通高19米
  </div>
</div>

<!-- Control Buttons -->
<div id="controls">
  <button class="ctrl-btn" id="btn-rotate" title="自动旋转">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
    </svg>
  </button>
  <button class="ctrl-btn" id="btn-explode" title="拆解视图">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
  </button>
  <button class="ctrl-btn" id="btn-reset" title="重置视角">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M3 12l3-3 3 3"/><path d="M6 9v6a3 3 0 0 0 3 3h6"/>
      <path d="M21 12l-3 3-3-3"/><path d="M18 15V9a3 3 0 0 0-3-3H9"/>
    </svg>
  </button>
</div>

<!-- Explode Slider -->
<div id="explode-control">
  <span class="explode-label">拆解</span>
  <input type="range" id="explode-slider" min="0" max="100" value="0">
  <span class="explode-value" id="explode-value">0%</span>
</div>

<!-- Info Panel -->
<div id="info-panel">
  <div class="panel-header">
    <button class="panel-close" id="panel-close">✕</button>
    <div class="panel-icon" id="panel-icon"></div>
    <div class="panel-title" id="panel-title"></div>
    <div class="panel-subtitle" id="panel-subtitle"></div>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>

<!-- Bottom Layer Selector -->
<div id="layer-selector"></div>

<!-- Tooltip -->
<div id="tooltip">
  <div class="tooltip-name" id="tooltip-name"></div>
  <div class="tooltip-hint" id="tooltip-hint"></div>
</div>

<!-- Hint -->
<div id="hint">
  拖拽旋转 · 滚轮缩放<br>点击构件查看详情
</div>

<!-- Compass -->
<svg id="compass" viewBox="0 0 60 60">
  <circle cx="30" cy="30" r="28" fill="rgba(30,22,14,0.7)" stroke="rgba(196,162,106,0.3)" stroke-width="1"/>
  <text x="30" y="12" text-anchor="middle" fill="#d4a050" font-size="10" font-family="serif">东</text>
  <text x="30" y="54" text-anchor="middle" fill="#8a7860" font-size="8" font-family="serif">西</text>
  <text x="8" y="33" text-anchor="middle" fill="#8a7860" font-size="8" font-family="serif">北</text>
  <text x="52" y="33" text-anchor="middle" fill="#8a7860" font-size="8" font-family="serif">南</text>
  <path d="M30 14 L26 28 L30 25 L34 28 Z" fill="#a83820"/>
  <path d="M30 46 L26 32 L30 35 L34 32 Z" fill="#4a3a28"/>
</svg>

<div id="canvas-container"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== Scene Setup =====
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x2a1f15, 80, 250);
scene.background = new THREE.Color(0x2a1f15);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(55, 30, 55);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 15;
controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI * 0.48;
controls.target.set(0, 8, 0);
controls.autoRotateSpeed = 0.6;

// ===== Lighting =====
const ambientLight = new THREE.AmbientLight(0xfff0d0, 0.45);
scene.add(ambientLight);

const hemiLight = new THREE.HemisphereLight(0xffddaa, 0x3a2818, 0.4);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xfff0c0, 1.1);
sunLight.position.set(40, 50, 30);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 200;
sunLight.shadow.camera.left = -60;
sunLight.shadow.camera.right = 60;
sunLight.shadow.camera.top = 60;
sunLight.shadow.camera.bottom = -60;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0xa08860, 0.3);
fillLight.position.set(-30, 20, -20);
scene.add(fillLight);

// Ground warming
const groundLight = new THREE.PointLight(0xc08040, 0.3, 40);
groundLight.position.set(0, 2, 10);
scene.add(groundLight);

// ===== Ground =====
const groundGeo = new THREE.PlaneGeometry(200, 200);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x3a2e1e,
  roughness: 0.95,
  metalness: 0
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// ===== Materials =====
const matWoodColumn = new THREE.MeshStandardMaterial({ color: 0x9a7038, roughness: 0.75, metalness: 0.05 });
const matWoodBeam = new THREE.MeshStandardMaterial({ color: 0xa07840, roughness: 0.7, metalness: 0.05 });
const matWoodDark = new THREE.MeshStandardMaterial({ color: 0x6b4a20, roughness: 0.8, metalness: 0.05 });
const matWoodLight = new THREE.MeshStandardMaterial({ color: 0xc4a26a, roughness: 0.65, metalness: 0.05 });
const matWall = new THREE.MeshStandardMaterial({ color: 0x8a6840, roughness: 0.85, metalness: 0.03 });
const matWallFill = new THREE.MeshStandardMaterial({ color: 0x7a5830, roughness: 0.9, metalness: 0.03 });
const matRoofTile = new THREE.MeshStandardMaterial({ color: 0x2d3a2e, roughness: 0.7, metalness: 0.1 });
const matRoofRidge = new THREE.MeshStandardMaterial({ color: 0x1a2820, roughness: 0.6, metalness: 0.15 });
const matStoneBase = new THREE.MeshStandardMaterial({ color: 0xb8b0a0, roughness: 0.9, metalness: 0.02 });
const matStoneDark = new THREE.MeshStandardMaterial({ color: 0x8a8278, roughness: 0.9, metalness: 0.02 });
const matGold = new THREE.MeshStandardMaterial({ color: 0xd4a050, roughness: 0.4, metalness: 0.6 });
const matRed = new THREE.MeshStandardMaterial({ color: 0xa83820, roughness: 0.5, metalness: 0.1 });
const matDragonGold = new THREE.MeshStandardMaterial({ color: 0xb89040, roughness: 0.45, metalness: 0.5 });
const matDragonGreen = new THREE.MeshStandardMaterial({ color: 0x4a6a3e, roughness: 0.5, metalness: 0.3 });
const matWater = new THREE.MeshStandardMaterial({ color: 0x2a5a6a, roughness: 0.15, metalness: 0.3, transparent: true, opacity: 0.8 });
const matPlaza = new THREE.MeshStandardMaterial({ color: 0xa09888, roughness: 0.92, metalness: 0.02 });

// ===== Interactive Groups =====
const interactiveParts = [];
const allMeshes = [];

function makeInteractive(group, partData) {
  group.userData = { ...partData, isInteractive: true };
  group.traverse(child => {
    if (child.isMesh) {
      child.userData = group.userData;
      allMeshes.push(child);
    }
  });
  interactiveParts.push(group);
  return group;
}

// ===== Scale: 1 unit = ~0.5 meter (approximate visual scale) =====
// Building: 31m wide, 25m deep, 19m tall → ~62 x 50 x 38 units
// But we compress for viewing: 1 unit ≈ 0.6m

// ===== Part 1: 台基与月台 (Stone Platform & Moon Platform) =====
function createPlatform() {
  const group = new THREE.Group();
  group.name = 'platform';
  
  // Lower platform (base)
  const baseGeo = new THREE.BoxGeometry(70, 1.5, 58);
  const base = new THREE.Mesh(baseGeo, matStoneBase);
  base.position.y = 0.75;
  base.castShadow = true;
  base.receiveShadow = true;
  group.add(base);
  
  // Upper platform
  const upperGeo = new THREE.BoxGeometry(66, 1.0, 54);
  const upper = new THREE.Mesh(upperGeo, matStoneDark);
  upper.position.y = 2.0;
  upper.castShadow = true;
  upper.receiveShadow = true;
  group.add(upper);
  
  // Moon platform (front, east side)
  const moonGeo = new THREE.BoxGeometry(28, 1.0, 12);
  const moon = new THREE.Mesh(moonGeo, matStoneBase);
  moon.position.set(0, 2.0, 33);
  moon.castShadow = true;
  moon.receiveShadow = true;
  group.add(moon);
  
  // Steps on east side (front)
  for (let i = 0; i < 3; i++) {
    const stepGeo = new THREE.BoxGeometry(20 - i * 2, 0.5, 2);
    const step = new THREE.Mesh(stepGeo, matStoneBase);
    step.position.set(0, 0.25 + i * 0.5, 40 + i * 1.5);
    step.castShadow = true;
    step.receiveShadow = true;
    group.add(step);
  }
  
  // Railings (simple)
  const railingMat = matStoneDark;
  const railH = 0.6;
  const railPositions = [
    { x: 12, z: 33, w: 0.3, d: 12 },
    { x: -12, z: 33, w: 0.3, d: 12 },
  ];
  railPositions.forEach(r => {
    const railGeo = new THREE.BoxGeometry(r.w, railH, r.d);
    const rail = new THREE.Mesh(railGeo, railingMat);
    rail.position.set(r.x, 2.5, r.z);
    rail.castShadow = true;
    group.add(rail);
  });
  
  // Stele
  const steleGeo = new THREE.BoxGeometry(1.2, 2.5, 0.4);
  const stele = new THREE.Mesh(steleGeo, matStoneDark);
  stele.position.set(8, 3.5, 33);
  stele.castShadow = true;
  group.add(stele);
  
  return makeInteractive(group, {
    id: 'platform',
    name: '台基与月台',
    icon: '🏛️',
    color: '#b8b0a0',
    explodeDir: { x: 0, y: -8, z: 0 }
  });
}

// ===== Part 2: 鱼沼飞梁 (Cross Bridge) =====
function createCrossBridge() {
  const group = new THREE.Group();
  group.name = 'bridge';
  
  // East-West bridge (19.6m x 5m → scaled)
  const ewBridgeGeo = new THREE.BoxGeometry(5, 0.5, 20);
  const ewBridge = new THREE.Mesh(ewBridgeGeo, matStoneBase);
  ewBridge.position.set(0, 2.5, 43);
  ewBridge.castShadow = true;
  ewBridge.receiveShadow = true;
  group.add(ewBridge);
  
  // North-South bridge (18.55m x 3.8m → scaled)
  const nsBridgeGeo = new THREE.BoxGeometry(19, 0.5, 4);
  const nsBridge = new THREE.Mesh(nsBridgeGeo, matStoneBase);
  nsBridge.position.set(0, 2.5, 43);
  nsBridge.castShadow = true;
  nsBridge.receiveShadow = true;
  group.add(nsBridge);
  
  // Bridge railings
  const railH = 0.5;
  // EW railings
  for (let side of [-1, 1]) {
    const railGeo = new THREE.BoxGeometry(0.3, railH, 20);
    const rail = new THREE.Mesh(railGeo, matStoneDark);
    rail.position.set(side * 2.3, 2.9, 43);
    rail.castShadow = true;
    group.add(rail);
  }
  // NS railings
  for (let side of [-1, 1]) {
    const railGeo = new THREE.BoxGeometry(19, railH, 0.3);
    const rail = new THREE.Mesh(railGeo, matStoneDark);
    rail.position.set(0, 2.9, 43 + side * 1.8);
    rail.castShadow = true;
    group.add(rail);
  }
  
  // 34 octagonal stone pillars (simplified as cylinders)
  const pillarPositions = [];
  // EW bridge pillars
  for (let i = -2; i <= 2; i++) {
    if (i === 0) continue;
    pillarPositions.push({ x: 2.2, z: 43 + i * 4 });
    pillarPositions.push({ x: -2.2, z: 43 + i * 4 });
  }
  // NS bridge pillars
  for (let i = -3; i <= 3; i++) {
    if (i === 0) continue;
    pillarPositions.push({ x: i * 3, z: 43 + 1.8 });
    pillarPositions.push({ x: i * 3, z: 43 - 1.8 });

  pillarPositions.forEach(p => {

function createRoofShape(width, depth, height, isLower) {
  // Create a hipped roof shape using custom geometry
  const shape = new THREE.BufferGeometry();
  const vertices = [];
  const indices = [];
  
  const hw = width / 2;
  const hd = depth / 2;
  const topW = hw * 0.6;
  const topD = hd * 0.6;
  const topY = height;
  
  // Eave overhang
  const eaveW = hw + 2;
  const eaveD = hd + 2;
  
  // Bottom corners
  const corners = [
    { x: -eaveW, z: -eaveD },  // 0: SW
    { x:  eaveW, z: -eaveD },  // 1: SE
    { x:  eaveW, z:  eaveD },  // 2: NE
    { x: -eaveW, z:  eaveD },  // 3: NW
  ];
  
  // Top corners (smaller)
  const topCorners = [
    { x: -topW, z: -topD },    // 4: SW top
    { x:  topW, z: -topD },    // 5: SE top
    { x:  topW, z:  topD },    // 6: NE top
    { x: -topW, z:  topD },    // 7: NW top
  ];
  
  // Bottom vertices (y=0)
  corners.forEach(c => vertices.push(c.x, 0, c.z));
  // Top vertices (y=height)
  topCorners.forEach(c => vertices.push(c.x, topY, c.z));
  // Ridge center
  vertices.push(0, topY + 0.5, 0);  // 8: top center (slightly raised)
  
  // Faces: 4 hip slopes
  // SW slope (0, 3, 7, 4)
  indices.push(0, 3, 7,  0, 7, 4);
  // SE slope (1, 0, 4, 5)
  indices.push(1, 0, 4,  1, 4, 5);
  // NE slope (2, 1, 5, 6)
  indices.push(2, 1, 5,  2, 5, 6);
  // NW slope (3, 2, 6, 7)
  indices.push(3, 2, 6,  3, 6, 7);
  
  // Top: four triangles meeting at ridge
  // SW (4, 7, 8)
  indices.push(4, 7, 8);
  // SE (5, 4, 8)
  indices.push(5, 4, 8);
  // NE (6, 5, 8)
  indices.push(6, 5, 8);
  // NW (7, 6, 8)
  indices.push(7, 6, 8);
  
  shape.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  shape.setIndex(indices);
  shape.computeVertexNormals();
  
  return shape;
}

// ===== Part 6: 木雕盘龙柱 (Carved Dragon Columns) =====
function createDragonColumns() {
  const group = new THREE.Group();
  group.name = 'dragonColumns';
  
  // 8 dragon columns in the front廊
  const dragonPositions = [];
  for (let i = 0; i < 8; i++) {
    const x = -28 + i * 8;
    dragonPositions.push(x);
  }
  
  dragonPositions.forEach((x, idx) => {
    // Column
    const colGeo = new THREE.CylinderGeometry(0.5, 0.55, 10, 16);
    const col = new THREE.Mesh(colGeo, matWoodColumn);
    col.position.set(x, 8, 21);
    col.castShadow = true;
    group.add(col);
    
    // Column base
    const baseGeo = new THREE.CylinderGeometry(0.65, 0.65, 0.4, 16);
    const base = new THREE.Mesh(baseGeo, matStoneDark);
    base.position.set(x, 2.8, 21);
    group.add(base);
    
    // Dragon body - coiled around column (using torus segments)
    const dragonColor = idx % 2 === 0 ? matDragonGold : matDragonGreen;
    const segments = 6;
    for (let s = 0; s < segments; s++) {
      const t = s / segments;
      const y = 3.5 + t * 7;
      const angle = t * Math.PI * 3 + idx * 0.5;
      const radius = 0.65;
      
      // Dragon body segment (small box/sphere)
      const segGeo = new THREE.SphereGeometry(0.35, 8, 6);
      const seg = new THREE.Mesh(segGeo, dragonColor);
      seg.position.set(

      seg.castShadow = true;
      group.add(seg);
    }
    
    // Dragon head (at top of column)
    const headGeo = new THREE.SphereGeometry(0.5, 8, 6);
    const head = new THREE.Mesh(headGeo, dragonColor);
    const headAngle = Math.PI * 3 + idx * 0.5;
    head.position.set(
      x + Math.cos(headAngle) * 0.7,
      10.5,
      21 + Math.sin(headAngle) * 0.7
    );
    head.scale.set(1.5, 1, 1);
    head.castShadow = true;
    group.add(head);
    
    // Dragon eyes
    const eyeGeo = new THREE.SphereGeometry(0.08, 4, 4);
    const eye = new THREE.Mesh(eyeGeo, matRed);
    eye.position.copy(head.position);
    eye.position.x += 0.3;
    eye.position.y += 0.1;
    group.add(eye);
    
    // Dragon horns
    const hornGeo = new THREE.ConeGeometry(0.1, 0.5, 4);
    const horn = new THREE.Mesh(hornGeo, dragonColor);
    horn.position.copy(head.position);
    horn.position.y += 0.4;
    horn.rotation.z = 0.3;
    group.add(horn);
  });
  
  return makeInteractive(group, {
    id: 'dragonColumns',
    name: '木雕盘龙柱',
    icon: '🐉',
    color: '#b89040',
    explodeDir: { x: 0, y: 0, z: 8 }
  });
}

// ===== Part 8: 难老泉 (Nanlao Spring) =====
function createSpring() {
  const group = new THREE.Group();
  group.name = 'spring';
  
  // Spring pool
  const poolGeo = new THREE.CylinderGeometry(4, 4.5, 1.5, 16);
  const pool = new THREE.Mesh(poolGeo, matStoneDark);
  pool.position.set(-15, 2, 50);
  pool.castShadow = true;
  pool.receiveShadow = true;
  group.add(pool);
  
  // Water surface
  const waterGeo = new THREE.CircleGeometry(3.8, 16);
  const water = new THREE.Mesh(waterGeo, matWater);
  water.rotation.x = -Math.PI / 2;
  water.position.set(-15, 2.5, 50);
  group.add(water);
  
  // Bubbling effect (small spheres)
  for (let i = 0; i < 5; i++) {
    const bubbleGeo = new THREE.SphereGeometry(0.15 + Math.random() * 0.1, 6, 6);
    const bubble = new THREE.Mesh(bubbleGeo, new THREE.MeshStandardMaterial({ color: 0x88ccee, roughness: 0.1, metalness: 0.3, transparent: true, opacity: 0.7 }));
    bubble.position.set(
      -15 + (Math.random() - 0.5) * 3,
      2.8 + Math.random() * 0.5,
      50 + (Math.random() - 0.5) * 3
    );
    bubble.userData.isBubble = true;
    bubble.userData.baseY = bubble.position.y;
    bubble.userData.phase = Math.random() * Math.PI * 2;
    group.add(bubble);
  }
  
  // Stone railing around pool
  for (let i = 0; i < 16; i++) {
    const angle = (i / 16) * Math.PI * 2;
    const postGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
    const post = new THREE.Mesh(postGeo, matStoneBase);
    post.position.set(
      -15 + Math.cos(angle) * 4.2,
      3.0,
      50 + Math.sin(angle) * 4.2
    );
    post.castShadow = true;
    group.add(post);
  }
  
  // Stele next to spring
  const steleGeo = new THREE.BoxGeometry(1, 3, 0.3);
  const stele = new THREE.Mesh(steleGeo, matStoneDark);
  stele.position.set(-10, 4, 52);
  stele.castShadow = true;
  group.add(stele);
  
  // Small pavilion over spring (亭)
  // Columns
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;
    const colGeo = new THREE.CylinderGeometry(0.2, 0.22, 4, 8);
    const col = new THREE.Mesh(colGeo, matWoodDark);
    col.position.set(
      -15 + Math.cos(angle) * 3.5,
      4.5,
      50 + Math.sin(angle) * 3.5
    );
    col.castShadow = true;
    group.add(col);
  }
  
  // Pavilion roof
  const pavRoofGeo = new THREE.ConeGeometry(4, 2, 4);
  const pavRoof = new THREE.Mesh(pavRoofGeo, matRoofTile);
  pavRoof.position.set(-15, 7, 50);
  pavRoof.rotation.y = Math.PI / 4;
  pavRoof.castShadow = true;
  group.add(pavRoof);
  
  // Finial
  const finialGeo = new THREE.SphereGeometry(0.3, 8, 8);
  const finial = new THREE.Mesh(finialGeo, matGold);
  finial.position.set(-15, 8.3, 50);
  group.add(finial);
  
  // Water channel/stream flowing east
  const streamGeo = new THREE.PlaneGeometry(1.5, 15);
  const stream = new THREE.Mesh(streamGeo, matWater);
  stream.rotation.x = -Math.PI / 2;
  stream.position.set(-15, 2.5, 60);
  group.add(stream);
  
  return makeInteractive(group, {
    id: 'spring',
    name: '难老泉',
    icon: '💧',
    color: '#2a5a6a',
    explodeDir: { x: -8, y: 0, z: 8 }
  });
}

function createTree(x, z, scale = 1) {
  const tree = new THREE.Group();
  const trunkGeo = new THREE.CylinderGeometry(0.3 * scale, 0.4 * scale, 3 * scale, 6);
  const trunk = new THREE.Mesh(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.9 }));
  trunk.position.y = 1.5 * scale;
  trunk.castShadow = true;
  tree.add(trunk);
  
  const foliageGeo = new THREE.ConeGeometry(2 * scale, 4 * scale, 8);
  const foliage = new THREE.Mesh(foliageGeo, new THREE.MeshStandardMaterial({ color: 0x3a5a3a, roughness: 0.85 }));
  foliage.position.y = 5 * scale;
  foliage.castShadow = true;
  tree.add(foliage);
  
  tree.position.set(x, 0, z);
  return tree;
}

// Ancient cypress (周柏) - special tree
function createAncientCypress(x, z) {
  const tree = new THREE.Group();
  // Tilted trunk
  const trunkGeo = new THREE.CylinderGeometry(0.35, 0.5, 6, 8);
  const trunk = new THREE.Mesh(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x3a2818, roughness: 0.95 }));
  trunk.position.set(0.5, 3, 0);
  trunk.rotation.z = 0.25;
  trunk.castShadow = true;
  tree.add(trunk);
  
  const foliageGeo = new THREE.ConeGeometry(1.5, 4, 6);
  const foliage = new THREE.Mesh(foliageGeo, new THREE.MeshStandardMaterial({ color: 0x4a5a3a, roughness: 0.9 }));
  foliage.position.set(1.5, 6.5, 0);
  foliage.rotation.z = 0.25;
  foliage.castShadow = true;
  tree.add(foliage);
  
  tree.position.set(x, 0, z);
  return tree;
}

scene.add(createTree(-35, -30));
scene.add(createTree(38, -25, 1.2));
scene.add(createTree(-40, 25));
scene.add(createTree(40, 35));
scene.add(createTree(-45, 5, 0.8));
scene.add(createAncientCypress(-32, 55));
scene.add(createAncientCypress(35, 60));

// ===== Raycasting & Interaction =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredPart = null;
let selectedPart = null;

function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(allMeshes, false);
  
  const tooltip = document.getElementById('tooltip');
  const tooltipName = document.getElementById('tooltip-name');
  const tooltipHint = document.getElementById('tooltip-hint');
  
  if (intersects.length > 0) {
    const obj = intersects[0].object;
    if (obj.userData && obj.userData.isInteractive) {
      hoveredPart = obj.userData;
      
      tooltipName.textContent = hoveredPart.name;
      tooltipHint.textContent = '点击查看详情';
      tooltip.style.left = (event.clientX + 15) + 'px';
      tooltip.style.top = (event.clientY - 10) + 'px';
      tooltip.classList.add('visible');
      
      document.body.style.cursor = 'pointer';
      
      // Highlight effect
      highlightPart(hoveredPart.id, true);
    } else {
      hoveredPart = null;
      tooltip.classList.remove('visible');
      document.body.style.cursor = 'default';
      clearHighlights();
    }
  } else {
    hoveredPart = null;
    tooltip.classList.remove('visible');
    document.body.style.cursor = 'default';
    clearHighlights();
  }
}

function highlightPart(partId, on) {
  interactiveParts.forEach(part => {
    if (part.userData.id === partId) {
      part.traverse(child => {
        if (child.isMesh && child.material) {
          if (!child.userData.origEmissive) {
            child.userData.origEmissive = child.material.emissive ? child.material.emissive.clone() : new THREE.Color(0,0,0);
          }
          if (on) {
            child.material.emissive = new THREE.Color(0x4a3020);
            child.material.emissiveIntensity = 0.4;
          } else {
            child.material.emissive = child.userData.origEmissive;
            child.material.emissiveIntensity = 1;
          }
        }
      });
    }
  });
}

function clearHighlights() {
  interactiveParts.forEach(part => {
    part.traverse(child => {
      if (child.isMesh && child.material && child.userData.origEmissive) {
        child.material.emissive = child.userData.origEmissive;
        child.material.emissiveIntensity = 1;
      }
    });
  });
}

function onClick(event) {
  if (hoveredPart) {
    showInfoPanel(hoveredPart.id);
    // Flash highlight
    clearHighlights();
    highlightPart(hoveredPart.id, true);
    setTimeout(() => {
      if (hoveredPart && hoveredPart.id === hoveredPart.id) {
        highlightPart(hoveredPart.id, true);
      }
    }, 100);
  }
}

// ===== Info Panel =====
function showInfoPanel(partId) {
  const data = partDataMap[partId];
  if (!data) return;
  
  selectedPart = partId;
  
  const panel = document.getElementById('info-panel');
  const iconEl = document.getElementById('panel-icon');
  const titleEl = document.getElementById('panel-title');
  const subtitleEl = document.getElementById('panel-subtitle');
  const bodyEl = document.getElementById('panel-body');
  
  iconEl.textContent = data.icon;
  iconEl.style.background = `rgba(${hexToRgb(data.iconColor)}, 0.15)`;
  iconEl.style.border = `1px solid rgba(${hexToRgb(data.iconColor)}, 0.3)`;
  
  titleEl.textContent = data.name;
  subtitleEl.textContent = data.subtitle;
  
  let html = '';
  
  // Tags
  html += '<div class="panel-section" style="border-top:none; padding-top:0;">';
  data.tags.forEach((tag, i) => {
    html += `<span class="panel-tag${i === 0 ? ' gold' : ''}">${tag}</span>`;
  });
  html += '</div>';
  
  // Description
  html += `<div class="panel-section"><div class="panel-section-title">详细说明</div><div class="panel-text">${data.description}</div></div>`;
  
  // Stats
  html += '<div class="panel-section"><div class="panel-section-title">关键数据</div><div class="panel-stats">';
  data.stats.forEach(s => {
    html += `<div class="stat-item"><div class="stat-label">${s.label}</div><div class="stat-value">${s.value}</div></div>`;
  });
  html += '</div></div>';
  
  // Section 2
  html += `<div class="panel-section"><div class="panel-section-title">${data.section2Title}</div><div class="panel-text">${data.section2Text}</div></div>`;
  
  bodyEl.innerHTML = html;
  panel.classList.add('visible');
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `${r}, ${g}, ${b}`;
}

function closeInfoPanel() {
  document.getElementById('info-panel').classList.remove('visible');
  selectedPart = null;
  clearHighlights();
}

// ===== Layer Selector =====
const layerButtons = [
  { id: 'all', name: '全景', color: '#d4a050' },
  { id: 'platform', name: '台基', color: '#b8b0a0' },
  { id: 'corridor', name: '副阶', color: '#a07840' },
  { id: 'mainHall', name: '殿身', color: '#a07840' },
  { id: 'dragonColumns', name: '盘龙柱', color: '#b89040' },
  { id: 'sculptures', name: '彩塑', color: '#a83820' },
  { id: 'roof', name: '屋顶', color: '#4a5a4e' },
  { id: 'bridge', name: '飞梁', color: '#b8b0a0' },
  { id: 'spring', name: '难老泉', color: '#2a5a6a' },
];

const layerSelector = document.getElementById('layer-selector');
let activeLayer = 'all';

layerButtons.forEach(btn => {
  const el = document.createElement('button');
  el.className = 'layer-btn' + (btn.id === 'all' ? ' active' : '');
  el.innerHTML = `<span class="layer-dot" style="background:${btn.color}"></span>${btn.name}`;
  el.dataset.id = btn.id;
  el.addEventListener('click', () => selectLayer(btn.id));
  layerSelector.appendChild(el);
});

function selectLayer(id) {
  activeLayer = id;
  document.querySelectorAll('.layer-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.id === id);
  });
  
  if (id === 'all') {
    interactiveParts.forEach(part => {
      part.visible = true;
      part.traverse(child => {
        if (child.isMesh) {
          child.material.transparent = false;
          child.material.opacity = 1;
        }
      });
    });
  } else {
    interactiveParts.forEach(part => {
      if (part.userData.id === id) {
        part.visible = true;
        part.traverse(child => {
          if (child.isMesh) {
            child.material.transparent = false;
            child.material.opacity = 1;
          }
        });
      } else {
        part.traverse(child => {
          if (child.isMesh) {
            child.material.transparent = true;
            child.material.opacity = 0.15;
          }
        });
      }
    });
  }
}

// ===== Explode View =====
let explodeAmount = 0;
let isExploding = false;

function setExplode(amount) {
  explodeAmount = amount;
  interactiveParts.forEach(part => {
    const orig = originalPositions.get(part);
    if (!orig) return;
    const dir = part.userData.explodeDir;
    if (!dir) return;
    
    part.position.x = orig.x + (dir.x || 0) * amount;
    part.position.y = orig.y + (dir.y || 0) * amount;
    part.position.z = orig.z + (dir.z || 0) * amount;
    
    if (dir.radial) {
      const angle = Math.atan2(orig.z, orig.x);
      part.position.x += Math.cos(angle) * dir.radial * amount;
      part.position.z += Math.sin(angle) * dir.radial * amount;
    }
  });
}

// ===== Button Events =====
const btnRotate = document.getElementById('btn-rotate');
const btnExplode = document.getElementById('btn-explode');
const btnReset = document.getElementById('btn-reset');
const explodeControl = document.getElementById('explode-control');
const explodeSlider = document.getElementById('explode-slider');
const explodeValue = document.getElementById('explode-value');

btnRotate.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnRotate.classList.toggle('active', controls.autoRotate);
});

btnExplode.addEventListener('click', () => {
  isExploding = !isExploding;
  btnExplode.classList.toggle('active', isExploding);
  explodeControl.classList.toggle('visible', isExploding);
  if (!isExploding) {
    setExplode(0);
    explodeSlider.value = 0;
    explodeValue.textContent = '0%';
  }
});

explodeSlider.addEventListener('input', (e) => {
  const val = parseInt(e.target.value);
  setExplode(val / 100);
  explodeValue.textContent = val + '%';
});

btnReset.addEventListener('click', () => {
  // Reset camera
  const targetPos = new THREE.Vector3(55, 30, 55);
  const targetLook = new THREE.Vector3(0, 8, 0);
  
  const startPos = camera.position.clone();
  const startLook = controls.target.clone();
  
  let t = 0;
  function animateReset() {
    t += 0.03;
    if (t > 1) t = 1;
    const ease = 1 - Math.pow(1 - t, 3);
    
    camera.position.lerpVectors(startPos, targetPos, ease);
    controls.target.lerpVectors(startLook, targetLook, ease);
    
    if (t < 1) requestAnimationFrame(animateReset);
  }
  animateReset();
  
  // Reset explode
  isExploding = false;
  btnExplode.classList.remove('active');
  explodeControl.classList.remove('visible');
  setExplode(0);
  explodeSlider.value = 0;
  explodeValue.textContent = '0%';
  
  // Reset layer
  selectLayer('all');
  
  // Reset rotation
  controls.autoRotate = false;
  btnRotate.classList.remove('active');
  
  // Close panel
  closeInfoPanel();
});

document.getElementById('panel-close').addEventListener('click', closeInfoPanel);

// ===== Event Listeners =====
window.addEventListener('mousemove', onMouseMove);
window.addEventListener('click', onClick);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===== Touch support =====
let touchStartX = 0, touchStartY = 0;
window.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
});

window.addEventListener('touchend', (e) => {
  if (e.changedTouches.length === 1) {
    const dx = Math.abs(e.changedTouches[0].clientX - touchStartX);
    const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
    if (dx < 10 && dy < 10) {
      // Treat as tap
      mouse.x = (e.changedTouches[0].clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.changedTouches[0].clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(allMeshes, false);
      if (intersects.length > 0) {
        const obj = intersects[0].object;
        if (obj.userData && obj.userData.isInteractive) {
          showInfoPanel(obj.userData.id);
        }
      }
    }
  }
});

// ===== Animation Loop =====
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  
  // Animate spring bubbles
  spring.traverse(child => {
    if (child.userData.isBubble) {
      child.position.y = child.userData.baseY + Math.sin(elapsed * 2 + child.userData.phase) * 0.3;
      child.position.x += Math.sin(elapsed * 1.5 + child.userData.phase) * 0.003;
    }
  });
  
  // Subtle water animation
  const waterMesh = spring.children.find(c => c.geometry && c.geometry.type === 'CircleGeometry');
  if (waterMesh) {
    waterMesh.material.opacity = 0.7 + Math.sin(elapsed * 1.5) * 0.1;
  }
  
  controls.update();
  renderer.render(scene, camera);
}

// ===== Loading Animation =====
let loadingProgress = 0;
const loadingBar = document.getElementById('loading-bar');
const loadingPercent = document.getElementById('loading-percent');
const loadingScreen = document.getElementById('loading-screen');

function simulateLoading() {
  loadingProgress += 2 + Math.random() * 8;
  if (loadingProgress > 100) loadingProgress = 100;
  
  loadingBar.style.width = loadingProgress + '%';
  loadingPercent.textContent = Math.floor(loadingProgress) + '%';
  
  if (loadingProgress < 100) {
    setTimeout(simulateLoading, 80 + Math.random() * 60);
  } else {
    setTimeout(() => {
      loadingScreen.classList.add('hidden');
      window.THREE = THREE;
window.scene = scene;
window.camera = camera;
window.renderer = renderer;
animate();

    }, 400);
  }
}

// Start
simulateLoading();
