<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佛光寺东大殿 · 三维交互模型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg-dark: #1a1410;
    --bg-darker: #0f0b08;
    --wood-light: #c4a26a;
    --wood-mid: #9a7b4a;
    --wood-dark: #6b4e2e;
    --tang-red: #8b3a2e;
    --tang-gold: #c9a96e;
    --tang-cream: #e8d5b0;
    --text-primary: #e8d5b0;
    --text-secondary: #a89170;
    --text-muted: #6b5e4a;
    --panel-bg: rgba(26, 20, 16, 0.92);
    --panel-border: rgba(201, 169, 110, 0.3);
    --accent: #c9a96e;
  }
  
  body {
    background: var(--bg-dark);
    color: var(--text-primary);
    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  
  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  
  #canvas-container {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, #2a1f15 0%, #0f0b08 70%);
  }
  
  canvas { display: block; }
  
  /* ===== 加载动画 ===== */
  #loader {
    position: absolute;
    inset: 0;
    background: var(--bg-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.8s ease;
  }
  
  #loader.hidden {
    opacity: 0;
    pointer-events: none;
  }
  
  .loader-ring {
    width: 80px;
    height: 80px;
    border: 3px solid rgba(201, 169, 110, 0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1.2s linear infinite;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  .loader-title {
    margin-top: 30px;
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 8px;
    font-weight: 600;
  }
  
  .loader-subtitle {
    margin-top: 10px;
    font-size: 14px;
    color: var(--text-secondary);
    letter-spacing: 4px;
  }
  
  .loader-progress {
    margin-top: 24px;
    width: 280px;
    height: 2px;
    background: rgba(201, 169, 110, 0.15);
    border-radius: 1px;
    overflow: hidden;
  }
  
  .loader-progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.3s ease;
    border-radius: 1px;
  }
  
  /* ===== 顶部标题栏 ===== */
  #header {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 20px 30px;
    background: linear-gradient(180deg, rgba(15, 11, 8, 0.85) 0%, transparent 100%);
    z-index: 100;
    pointer-events: none;
  }
  
  #header h1 {
    font-size: 24px;
    color: var(--accent);
    letter-spacing: 6px;
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  
  #header .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
    letter-spacing: 2px;
  }
  
  #header .era-tag {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 12px;
    background: rgba(139, 58, 46, 0.4);
    border: 1px solid rgba(201, 169, 110, 0.3);
    border-radius: 3px;
    font-size: 12px;
    color: var(--tang-gold);
    letter-spacing: 1px;
  }
  
  /* ===== 右侧控制按钮 ===== */
  #controls {
    position: absolute;
    top: 100px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 100;
  }
  
  .ctrl-btn {
    width: 44px;
    height: 44px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--accent);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    backdrop-filter: blur(8px);
    font-size: 18px;
  }
  
  .ctrl-btn:hover {
    background: rgba(201, 169, 110, 0.15);
    border-color: var(--accent);
    transform: translateX(-3px);
  }
  
  .ctrl-btn.active {
    background: rgba(201, 169, 110, 0.2);
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(201, 169, 110, 0.3);
  }
  
  .ctrl-btn svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }
  
  .ctrl-btn .tooltip-text {
    position: absolute;
    right: 52px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--text-primary);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  
  .ctrl-btn:hover .tooltip-text {
    opacity: 1;
  }
  
  /* ===== 底部图层选择器 ===== */
  #layer-selector {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    z-index: 100;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 90vw;
  }
  
  .layer-btn {
    padding: 8px 14px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: all 0.25s ease;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  
  .layer-btn:hover {
    color: var(--accent);
    background: rgba(201, 169, 110, 0.08);
  }
  
  .layer-btn.active {
    color: var(--bg-dark);
    background: var(--accent);
    border-color: var(--accent);
  }
  
  /* ===== 信息面板 ===== */
  #info-panel {
    position: absolute;
    top: 50%;
    left: 24px;
    transform: translateY(-50%) translateX(-420px);
    width: 380px;
    max-height: 70vh;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    backdrop-filter: blur(12px);
    z-index: 200;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  
  #info-panel.open {
    transform: translateY(-50%) translateX(0);
  }
  
  .panel-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  
  .panel-header h2 {
    font-size: 18px;
    color: var(--accent);
    letter-spacing: 3px;
    font-weight: 600;
  }
  
  .panel-header .panel-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
    letter-spacing: 1px;
  }
  
  .panel-close {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
    padding: 0;
    transition: color 0.2s;
  }
  
  .panel-close:hover {
    color: var(--accent);
  }
  
  .panel-body {
    padding: 16px 20px 20px;
    overflow-y: auto;
    flex: 1;
  }
  
  .panel-body::-webkit-scrollbar {
    width: 4px;
  }
  
  .panel-body::-webkit-scrollbar-track {
    background: transparent;
  }
  
  .panel-body::-webkit-scrollbar-thumb {
    background: var(--panel-border);
    border-radius: 2px;
  }
  
  .panel-body p {
    font-size: 14px;
    line-height: 1.8;
    color: var(--text-primary);
    margin-bottom: 12px;
  }
  
  .panel-body .info-row {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  
  .panel-body .info-label {
    color: var(--text-muted);
    min-width: 70px;
    flex-shrink: 0;
  }
  
  .panel-body .info-value {
    color: var(--text-primary);
  }
  
  .panel-body .highlight-box {
    margin-top: 12px;
    padding: 12px;
    background: rgba(139, 58, 46, 0.15);
    border-left: 3px solid var(--tang-red);
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--tang-cream);
  }
  
  .panel-body .quote-box {
    margin-top: 12px;
    padding: 12px 14px;
    background: rgba(201, 169, 110, 0.06);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-secondary);
    font-style: italic;
  }
  
  /* ===== 悬停tooltip ===== */
  #hover-tooltip {
    position: absolute;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    padding: 6px 12px;
    border-radius: 5px;
    font-size: 13px;
    color: var(--accent);
    pointer-events: none;
    z-index: 150;
    opacity: 0;
    transition: opacity 0.15s ease;
    backdrop-filter: blur(8px);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  
  #hover-tooltip.visible {
    opacity: 1;
  }
  
  /* ===== 左下角说明 ===== */
  #help-text {
    position: absolute;
    bottom: 80px;
    left: 24px;
    font-size: 12px;
    color: var(--text-muted);
    z-index: 50;
    letter-spacing: 1px;
    pointer-events: none;
  }
  
  #help-text .help-line {
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  #help-text .help-key {
    display: inline-block;
    padding: 1px 6px;
    background: rgba(201, 169, 110, 0.1);
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    font-size: 11px;
    color: var(--accent);
  }
  
  /* ===== 装饰元素 ===== */
  .decor-corner {
    position: absolute;
    width: 60px;
    height: 60px;
    border: 1px solid var(--panel-border);
    pointer-events: none;
    z-index: 50;
  }
  
  .decor-corner.tl {
    top: 12px; left: 12px;
    border-right: none; border-bottom: none;
  }
  
  .decor-corner.tr {
    top: 12px; right: 12px;
    border-left: none; border-bottom: none;
  }
  
  .decor-corner.bl {
    bottom: 12px; left: 12px;
    border-right: none; border-top: none;
  }
  
  .decor-corner.br {
    bottom: 12px; right: 12px;
    border-left: none; border-top: none;
  }
  
  @media (max-width: 768px) {
    #info-panel {
      width: calc(100vw - 48px);
      left: 24px;
    }
    #header h1 { font-size: 18px; letter-spacing: 4px; }
    .layer-btn { font-size: 11px; padding: 6px 10px; }
    #help-text { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-container"></div>
  
  <!-- 装饰角 -->
  <div class="decor-corner tl"></div>
  <div class="decor-corner tr"></div>
  <div class="decor-corner bl"></div>
  <div class="decor-corner br"></div>
  
  <!-- 加载动画 -->
  <div id="loader">
    <div class="loader-ring"></div>
    <div class="loader-title">佛光寺东大殿</div>
    <div class="loader-subtitle">唐代木构建筑三维模型</div>
    <div class="loader-progress"><div class="loader-progress-bar" id="loader-bar"></div></div>
  </div>
  
  <!-- 顶部标题 -->
  <div id="header">
    <h1>佛光寺东大殿</h1>
    <div class="subtitle">五台山 · 唐大中十一年（公元857年）</div>
    <div class="era-tag">中国现存最大最完整的唐代木构建筑</div>
  </div>
  
  <!-- 右侧控制按钮 -->
  <div id="controls">
    <button class="ctrl-btn" id="btn-rotate" title="自动旋转">
      <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
      <span class="tooltip-text">自动旋转</span>
    </button>
    <button class="ctrl-btn" id="btn-explode" title="拆解视图">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L19.82 8 12 11.82 4.18 8 12 4.18zM4 9.82l7 3.5v7.86l-7-3.5V9.82zm9 11.36v-7.86l7-3.5v7.86l-7 3.5z"/></svg>
      <span class="tooltip-text">拆解视图</span>
    </button>
    <button class="ctrl-btn" id="btn-reset" title="重置视角">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      <span class="tooltip-text">重置视角</span>
    </button>
  </div>
  
  <!-- 底部图层选择器 -->
  <div id="layer-selector">
    <button class="layer-btn active" data-layer="all">全景</button>
    <button class="layer-btn" data-layer="structure">主体木构</button>
    <button class="layer-btn" data-layer="dougong">斗拱铺作</button>
    <button class="layer-btn" data-layer="roof">庑殿屋顶</button>
    <button class="layer-btn" data-layer="columns">柱网布局</button>
    <button class="layer-btn" data-layer="sculptures">唐代彩塑</button>
    <button class="layer-btn" data-layer="mural">唐代壁画</button>
    <button class="layer-btn" data-layer="base">台基经幢</button>
    <button class="layer-btn" data-layer="inscription">唐代题记</button>
  </div>
  
  <!-- 左下角操作说明 -->
  <div id="help-text">
    <div class="help-line"><span class="help-key">鼠标拖拽</span> 旋转视角</div>
    <div class="help-line"><span class="help-key">滚轮</span> 缩放</div>
    <div class="help-line"><span class="help-key">点击</span> 查看详情</div>
  </div>
  
  <!-- 悬停tooltip -->
  <div id="hover-tooltip"></div>
  
  <!-- 信息面板 -->
  <div id="info-panel">
    <div class="panel-header">
      <div>
        <h2 id="panel-title">标题</h2>
        <div class="panel-subtitle" id="panel-subtitle">副标题</div>
      </div>
      <button class="panel-close" id="panel-close">×</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </div>
</div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==================== 全局变量 ====================
let scene, camera, renderer, controls;
let raycaster, mouse;
let modelGroup;
let parts = {}; // 存储各可点击部分
let hoveredObject = null;
let autoRotate = false;
let exploded = false;
let currentLayer = 'all';
let mixer = null;
let clock = new THREE.Clock();

// 拆解视图的偏移量
const explodeOffsets = {
  roof: new THREE.Vector3(0, 8, 0),
  dougong: new THREE.Vector3(0, 3, 0),
  structure: new THREE.Vector3(0, 0, 0),
  columns: new THREE.Vector3(0, -2, 0),
  sculptures: new THREE.Vector3(-3, -1, 0),
  mural: new THREE.Vector3(3, 0, 0),
  base: new THREE.Vector3(0, -5, 0),
  inscription: new THREE.Vector3(0, 1, 3)
};

// 信息面板内容
const partInfo = {
  structure: {
    title: '东大殿主体',
    subtitle: '唐代木构建筑 · 大中十一年（857年）',
    content: `
      <div class="info-row"><span class="info-label">位置</span><span class="info-value">忻州市五台县豆村镇佛光村</span></div>
      <div class="info-row"><span class="info-label">年代</span><span class="info-value">唐大中十一年（公元857年）</span></div>
      <div class="info-row"><span class="info-label">面阔</span><span class="info-value">七间，约34米</span></div>
      <div class="info-row"><span class="info-label">进深</span><span class="info-value">四间八架椽，约17.66米</span></div>
      <div class="info-row"><span class="info-label">朝向</span><span class="info-value">坐东朝西</span></div>
      <p>佛光寺东大殿是中国现存最大、最完整的唐代木构建筑。大殿建于唐宣宗大中十一年，由女弟子宁公遇出资建造，主持者为愿诚和尚。大殿面阔七间，进深四间，规模宏大，气势雄浑，充分体现了唐代建筑雄浑大气的风格特征。</p>
      <div class="highlight-box">
        梁思成先生1937年发现此殿后，将其誉为"中国第一国宝"，称其为"中国古建第一瑰宝"。这一发现打破了日本学者"中国境内无唐代木构建筑"的断言。
      </div>
    `
  },
  dougong: {
    title: '斗拱铺作',
    subtitle: '双杪双下昂 · 七铺作',
    content: `
      <div class="info-row"><span class="info-label">类型</span><span class="info-value">柱头铺作：双杪双下昂七铺作</span></div>
      <div class="info-row"><span class="info-label">高度</span><span class="info-value">约3.4米</span></div>
      <div class="info-row"><span class="info-label">宽度</span><span class="info-value">约4.7米</span></div>
      <div class="info-row"><span class="info-label">比例</span><span class="info-value">斗拱高约为柱高的1/2</span></div>
      <p>东大殿的斗拱是中国古建筑中最为宏大、复杂的斗拱实例之一。柱头铺作为七铺作双杪双下昂，出跳深远，体量巨大。斗拱高度达到柱高的二分之一，远超后世建筑的比例，展现出唐代建筑"斗拱雄大、檐出深远"的典型特征。</p>
      <p>巨大的斗拱不仅具有结构功能——将屋檐荷载传递到柱子上，更是唐代建筑美学的重要组成部分，展现出力量与韵律的完美结合。</p>
      <div class="quote-box">"斗拱之雄大，檐出之深远，为唐代建筑之特征。" —— 梁思成</div>
    `
  },
  roof: {
    title: '庑殿顶与鸱吻',
    subtitle: '单檐庑殿顶（四阿顶）',
    content: `
      <div class="info-row"><span class="info-label">形式</span><span class="info-value">单檐庑殿顶（四阿顶）</span></div>
      <div class="info-row"><span class="info-label">坡度</span><span class="info-value">举高约1/4.77，坡度平缓</span></div>
      <div class="info-row"><span class="info-label">鸱吻</span><span class="info-value">保留旧制式样</span></div>
      <p>庑殿顶是中国古建筑屋顶等级最高的形式，有五条脊、四面坡。东大殿的庑殿顶坡度极为平缓，举高比约1/4.77，与后世明清建筑陡峭的屋顶形成鲜明对比，体现了唐代建筑庄重沉稳的气质。</p>
      <p>正脊两端的鸱吻（鸱尾）保留了早期式样，形制古朴，是研究中国古建筑屋脊装饰演变的重要实物。</p>
      <div class="highlight-box">
        平缓的屋顶坡度、深远的出檐与巨大的斗拱相配合，形成了东大殿庄重雄浑的轮廓线，是唐代建筑风格的典型体现。
      </div>
    `
  },
  columns: {
    title: '柱网与金厢斗底槽',
    subtitle: '内外两圈柱 · 侧脚与升起',
    content: `
      <div class="info-row"><span class="info-label">平面形式</span><span class="info-value">"金厢斗底槽"（内外两圈柱）</span></div>

// ==================== 材质 ====================
function createWoodMaterial(color = 0x9a7b4a, roughness = 0.85) {
  return new THREE.MeshStandardMaterial({
    color: color,
    roughness: roughness,
    metalness: 0.05,
    flatShading: false
  });
}

function createRoofMaterial() {
  return new THREE.MeshStandardMaterial({
    color: 0x4a3a2a,
    roughness: 0.7,
    metalness: 0.1
  });
}

function createStoneMaterial(color = 0x8a8276) {
  return new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.95,
    metalness: 0.02
  });
}

function createGoldMaterial() {
  return new THREE.MeshStandardMaterial({
    color: 0xc9a96e,
    roughness: 0.3,
    metalness: 0.7,
    emissive: 0x3a2a10,
    emissiveIntensity: 0.2
  });
}

// ==================== 构建模型 ====================
function buildModel() {
  // 比例缩放：实际34m面阔 -> 模型约20单位
  const scale = 0.55;
  
  // ===== 1. 台基 =====
  buildBase(scale);
  
  // ===== 2. 柱网（金厢斗底槽）=====
  buildColumns(scale);
  
  // ===== 3. 斗拱 =====
  buildDougong(scale);
  
  // ===== 4. 屋顶（庑殿顶）=====
  buildRoof(scale);
  
  // ===== 5. 墙体 =====
  buildWalls(scale);
  
  // ===== 6. 佛坛彩塑 =====
  buildSculptures(scale);
  
  // ===== 7. 壁画 =====
  buildMural(scale);
  
  // ===== 8. 题记 =====
  buildInscription(scale);
  
  // 为所有mesh设置用户数据
  modelGroup.traverse(obj => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;
    }
  });
}

// ----- 台基 -----
function buildBase(s) {
  const baseGroup = new THREE.Group();
  baseGroup.name = 'base';
  
  const stoneMat = createStoneMaterial(0x7a6e5a);
  
  // 主台基 - 两层
  const base1 = new THREE.Mesh(
    new THREE.BoxGeometry(26 * s, 1.2, 16 * s),
    stoneMat
  );
  base1.position.y = 0.6;
  baseGroup.add(base1);
  
  const base2 = new THREE.Mesh(
    new THREE.BoxGeometry(24 * s, 0.8, 14 * s),
    createStoneMaterial(0x8a7e6a)
  );
  base2.position.y = 1.6;
  baseGroup.add(base2);
  
  // 台阶（正面西侧）
  for (let i = 0; i < 5; i++) {
    const step = new THREE.Mesh(
      new THREE.BoxGeometry(8 * s, 0.3, 0.6),
      stoneMat
    );
    step.position.set(0, 0.15 + i * 0.3, -8 * s - i * 0.6);
    baseGroup.add(step);
  }
  
  // 经幢
  const pillarBase = new THREE.Mesh(
    new THREE.CylinderGeometry(0.6 * s, 0.7 * s, 0.3, 8),
    stoneMat
  );
  pillarBase.position.set(-6 * s, 2.15, -5 * s);
  baseGroup.add(pillarBase);
  
  const pillar = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35 * s, 0.4 * s, 4 * s, 8),
    createStoneMaterial(0x9a8e7a)
  );
  pillar.position.set(-6 * s, 4.3, -5 * s);
  baseGroup.add(pillar);
  
  // 经幢顶部
  const pillarTop = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.6 * s),
    createStoneMaterial(0x8a7e6a)
  );
  pillarTop.position.set(-6 * s, 6.5, -5 * s);
  baseGroup.add(pillarTop);
  
  baseGroup.userData = { partKey: 'base', partName: '台基与经幢' };
  parts.base = baseGroup;
  modelGroup.add(baseGroup);
}

// ----- 柱网 -----
function buildColumns(s) {
  const colGroup = new THREE.Group();
  colGroup.name = 'columns';
  
  const woodMat = createWoodMaterial(0x8a6a3a, 0.8);
  const colRadius = 0.35 * s;
  const colHeight = 5 * s;
  
  // 外圈柱（檐柱）- 面阔7间，进深4间
  // 面阔方向：7间 = 8根柱子（含角柱），间距约 4.8 * s
  // 进深方向：4间 = 5根柱子，间距约 4.4 * s
  
  const baysWidth = 7;
  const baysDepth = 4;
  const colSpacingW = 4.2 * s;
  const colSpacingD = 3.8 * s;
  
  const totalW = baysWidth * colSpacingW;
  const totalD = baysDepth * colSpacingD;
  
  const outerCols = [];
  for (let i = 0; i <= baysWidth; i++) {
    for (let j = 0; j <= baysDepth; j++) {
      // 只在边缘放柱子
      if (i === 0 || i === baysWidth || j === 0 || j === baysDepth) {
        const x = -totalW / 2 + i * colSpacingW;
        const z = -totalD / 2 + j * colSpacingD;
        
        // 侧脚：角柱向内倾斜
        const tiltX = (i === 0 ? 0.08 : i === baysWidth ? -0.08 : 0) * s;
        const tiltZ = (j === 0 ? 0.08 : j === baysDepth ? -0.08 : 0) * s;
        
        // 升起：角柱略高
        const isCorner = (i === 0 || i === baysWidth) && (j === 0 || j === baysDepth);
        const heightOffset = isCorner ? 0.15 : 0;
        
        const col = createColumn(colRadius, colHeight + heightOffset, woodMat);
        col.position.set(x, 2.2 + (colHeight + heightOffset) / 2, z);
        col.rotation.z = tiltX;
        col.rotation.x = tiltZ;
        colGroup.add(col);
        outerCols.push(col);
      }
    }
  }
  
  // 内圈柱（金柱）- 形成金厢斗底槽
  const innerBaysW = 5; // 内圈少一间
  const innerBaysD = 2;  
  const innerColSpacingW = colSpacingW;
  const innerColSpacingD = colSpacingD;
  const innerTotalW = innerBaysW * innerColSpacingW;
  const innerTotalD = innerBaysD * innerColSpacingD;
  
  for (let i = 0; i <= innerBaysW; i++) {
    for (let j = 0; j <= innerBaysD; j++) {
      if (i === 0 || i === innerBaysW || j === 0 || j === innerBaysD) {
        const x = -innerTotalW / 2 + i * innerColSpacingW;
        const z = -innerTotalD / 2 + j * innerColSpacingD;
        const col = createColumn(colRadius * 0.95, colHeight, woodMat);
        col.position.set(x, 2.2 + colHeight / 2, z);
        colGroup.add(col);
      }
    }
  }
  
  // 阑额（连接柱顶的横木）
  const lintelMat = createWoodMaterial(0x7a5a3a, 0.85);
  const lintelH = 0.3 * s;
  const lintelD = 0.25 * s;
  
  // 外圈阑额
  for (let i = 0; i < baysWidth; i++) {
    const z = -totalD / 2;
    const x1 = -totalW / 2 + i * colSpacingW;
    const x2 = -totalW / 2 + (i + 1) * colSpacingW;
    const lintel = new THREE.Mesh(
      new THREE.BoxGeometry(colSpacingW, lintelH, lintelD),
      lintelMat
    );
    lintel.position.set((x1 + x2) / 2, 2.2 + colHeight - 0.3, z);
    colGroup.add(lintel);
    
    const lintelBack = lintel.clone();
    lintelBack.position.z = totalD / 2;
    colGroup.add(lintelBack);
  }
  
  for (let j = 0; j < baysDepth; j++) {
    const x = -totalW / 2;
    const z1 = -totalD / 2 + j * colSpacingD;
    const z2 = -totalD / 2 + (j + 1) * colSpacingD;
    const lintel = new THREE.Mesh(
      new THREE.BoxGeometry(lintelD, lintelH, colSpacingD),
      lintelMat
    );
    lintel.position.set(x, 2.2 + colHeight - 0.3, (z1 + z2) / 2);
    colGroup.add(lintel);
    
    const lintelRight = lintel.clone();
    lintelRight.position.x = totalW / 2;
    colGroup.add(lintelRight);
  }
  
  colGroup.userData = { partKey: 'columns', partName: '柱网与金厢斗底槽' };
  parts.columns = colGroup;
  modelGroup.add(colGroup);
}

function createColumn(radius, height, material) {
  // 带卷杀的柱子 - 使用LatheGeometry
  const points = [];
  const segments = 12;
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const y = t * height;
    // 卷杀：上端略细
    const r = radius * (1 - 0.08 * Math.pow(t, 2));
    points.push(new THREE.Vector2(Math.max(r, 0.01), y));
  }
  const geom = new THREE.LatheGeometry(points, 16);
  return new THREE.Mesh(geom, material);
}

// ----- 斗拱 -----
function buildDougong(s) {
  const dougongGroup = new THREE.Group();
  dougongGroup.name = 'dougong';
  
  const woodMat = createWoodMaterial(0xa07a4a, 0.75);
  const darkWoodMat = createWoodMaterial(0x7a5a3a, 0.8);
  
  const baysWidth = 7;
  const baysDepth = 4;
  const colSpacingW = 4.2 * s;
  const colSpacingD = 3.8 * s;
  const totalW = baysWidth * colSpacingW;
  const totalD = baysDepth * colSpacingD;
  const colHeight = 5 * s;
  const baseY = 2.2 + colHeight - 0.3;
  
  // 柱头铺作 - 在每根柱头上
  for (let i = 0; i <= baysWidth; i++) {
    for (let j = 0; j <= baysDepth; j++) {
      if (i === 0 || i === baysWidth || j === 0 || j === baysDepth) {
        const x = -totalW / 2 + i * colSpacingW;
        const z = -totalD / 2 + j * colSpacingD;
        const dougong = createDougongUnit(s, woodMat, darkWoodMat);
        dougong.position.set(x, baseY, z);
        dougongGroup.add(dougong);
      }
    }
  }
  
  // 补间铺作 - 柱间
  for (let i = 0; i < baysWidth; i++) {
    for (let j = 0; j <= baysDepth; j++) {
      if (j === 0 || j === baysDepth) {
        const x = -totalW / 2 + (i + 0.5) * colSpacingW;
        const z = -totalD / 2 + j * colSpacingD;
        const dougong = createDougongUnit(s, woodMat, darkWoodMat, 0.8);
        dougong.position.set(x, baseY, z);
        dougongGroup.add(dougong);
      }
    }
  }
  
  for (let j = 0; j < baysDepth; j++) {
    for (let i = 0; i <= baysWidth; i++) {
      if (i === 0 || i === baysWidth) {
        const x = -totalW / 2 + i * colSpacingW;
        const z = -totalD / 2 + (j + 0.5) * colSpacingD;
        const dougong = createDougongUnit(s, woodMat, darkWoodMat, 0.8);
        dougong.position.set(x, baseY, z);
        dougongGroup.add(dougong);
      }
    }
  }
  
  dougongGroup.userData = { partKey: 'dougong', partName: '斗拱铺作' };
  parts.dougong = dougongGroup;
  modelGroup.add(dougongGroup);
}

function createDougongUnit(s, mat, darkMat, scale = 1) {
  const group = new THREE.Group();
  const size = 1.0 * s * scale;
  const h = 3.4 * s * scale; // 斗拱高度
  
  // 栌斗（大斗）
  const ludou = new THREE.Mesh(
    new THREE.BoxGeometry(size * 1.2, size * 0.5, size * 1.2),
    darkMat
  );
  ludou.position.y = size * 0.25;
  group.add(ludou);
  
  // 泥道拱
  const nidao = new THREE.Mesh(
    new THREE.BoxGeometry(size * 0.4, size * 0.6, size * 2.5),
    mat
  );
  nidao.position.y = size * 0.7;
  group.add(nidao);
  
  // 华拱（第一跳）
  const huagong1 = new THREE.Mesh(
    new THREE.BoxGeometry(size * 2.8, size * 0.55, size * 0.4),
    mat
  );
  huagong1.position.y = size * 1.05;
  group.add(huagong1);
  
  // 散斗
  const sandou1 = new THREE.Mesh(
    new THREE.BoxGeometry(size * 0.5, size * 0.35, size * 0.5),

  );

// ----- 屋顶 -----
function buildRoof(s) {
  const roofGroup = new THREE.Group();
  roofGroup.name = 'roof';
  
  const roofMat = createRoofMaterial();
  const darkRoofMat = new THREE.MeshStandardMaterial({
    color: 0x3a2a1a,
    roughness: 0.65,
    metalness: 0.1
  });
  
  const baysWidth = 7;
  const baysDepth = 4;
  const colSpacingW = 4.2 * s;
  const colSpacingD = 3.8 * s;
  const totalW = baysWidth * colSpacingW;
  const totalD = baysDepth * colSpacingD;
  
  const colHeight = 5 * s;
  const dougongH = 3.4 * s;
  const baseY = 2.2 + colHeight + dougongH;
  
  // 屋顶尺寸（出檐深远）
  const roofW = totalW + 6 * s; // 出檐
  const roofD = totalD + 6 * s;
  const roofThickness = 0.3 * s;
  
  // 庑殿顶 - 用自定义形状
  // 坡度约1/4.77
  const roofHeight = roofD / 2 / 4.77 * 3; // 调整高度使看起来合适
  
  // 主屋面 - 四面坡
  // 前后坡
  const slopeAngle = Math.atan2(roofHeight, roofD / 2);
  
  // 创建庑殿顶几何体
  const roofShape = createWudianRoof(roofW, roofD, roofHeight, s);
  roofShape.position.y = baseY;
  roofGroup.add(roofShape);
  
  // 正脊
  const ridgeLen = roofW * 0.7;
  const ridge = new THREE.Mesh(
    new THREE.BoxGeometry(ridgeLen, 0.4 * s, 0.5 * s),
    darkRoofMat
  );
  ridge.position.set(0, baseY + roofHeight + 0.2 * s, 0);
  roofGroup.add(ridge);
  
  // 鸱吻（正脊两端）
  const chiwenGeo = new THREE.ConeGeometry(0.6 * s, 1.5 * s, 4);
  const chiwen1 = new THREE.Mesh(chiwenGeo, darkRoofMat);
  chiwen1.position.set(-ridgeLen / 2, baseY + roofHeight + 0.6 * s, 0);
  chiwen1.rotation.z = 0.3;
  chiwen1.rotation.y = Math.PI / 4;
  roofGroup.add(chiwen1);
  
  const chiwen2 = new THREE.Mesh(chiwenGeo, darkRoofMat);
  chiwen2.position.set(ridgeLen / 2, baseY + roofHeight + 0.6 * s, 0);
  chiwen2.rotation.z = -0.3;
  chiwen2.rotation.y = Math.PI / 4;
  roofGroup.add(chiwen2);
  
  // 戗脊（四条）
  const qiangRidgeMat = darkRoofMat;
  for (let i = 0; i < 4; i++) {
    const angle = (Math.PI / 2) * i + Math.PI / 4;
    const x1 = Math.cos(angle) * roofW * 0.35;
    const z1 = Math.sin(angle) * roofD * 0.35;
    const x2 = Math.cos(angle) * roofW * 0.5;
    const z2 = Math.sin(angle) * roofD * 0.5;
    
    const len = Math.sqrt((x2 - x1) ** 2 + (z2 - z1) ** 2);
    const qiang = new THREE.Mesh(
      new THREE.BoxGeometry(0.2 * s, 0.2 * s, len),
      qiangRidgeMat
    );
    qiang.position.set((x1 + x2) / 2, baseY + roofHeight * 0.4, (z1 + z2) / 2);
    qiang.rotation.y = Math.atan2(x2 - x1, z2 - z1);
    qiang.rotation.x = slopeAngle * 0.5;
    roofGroup.add(qiang);
  }
  
  // 瓦楞效果（用条纹）
  for (let i = -6; i <= 6; i++) {
    const tile = new THREE.Mesh(
      new THREE.BoxGeometry(0.1 * s, 0.08 * s, roofD * 0.4),
      darkRoofMat
    );
    tile.position.set(i * 1.6 * s, baseY + roofHeight * 0.5, -roofD * 0.2);
    tile.rotation.x = -slopeAngle;
    roofGroup.add(tile);
    
    const tile2 = tile.clone();
    tile2.position.z = roofD * 0.2;
    tile2.rotation.x = slopeAngle;
    roofGroup.add(tile2);
  }
  
  roofGroup.userData = { partKey: 'roof', partName: '庑殿顶与鸱吻' };
  parts.roof = roofGroup;
  modelGroup.add(roofGroup);
}

function createWudianRoof(w, d, h, s) {
  const group = new THREE.Group();
  const roofMat = createRoofMaterial();
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.6 });
  
  // 四面坡屋面 - 使用自定义BufferGeometry
  // 前坡
  const frontGeo = new THREE.BufferGeometry();
  const halfW = w / 2;
  const halfD = d / 2;
  const overhang = 1.5 * s;
  
  // 前坡顶点
  const vertices = new Float32Array([
    // 前坡
    -halfW, 0, -halfD,
     halfW, 0, -halfD,
     halfW, h, 0,
    -halfW, 0, -halfD,
     halfW, h, 0,
    -halfW, h, 0,
    
    // 后坡
    -halfW, 0, halfD,
     halfW, h, 0,
     halfW, 0, halfD,
    -halfW, 0, halfD,
    -halfW, h, 0,
     halfW, h, 0,
    
    // 左前坡
    -halfW, 0, -halfD,
    -halfW, h, 0,
    -halfW + overhang, 0, -halfD + overhang * 0.5,
    
    // 左后坡
    -halfW, 0, halfD,
    -halfW + overhang, 0, halfD - overhang * 0.5,
    -halfW, h, 0,
    
    // 右前坡
     halfW, 0, -halfD,
     halfW - overhang, 0, -halfD + overhang * 0.5,
     halfW, h, 0,
    
    // 右后坡
     halfW, 0, halfD,
     halfW, h, 0,
     halfW - overhang, 0, halfD - overhang * 0.5,
  ]);
  
  frontGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  frontGeo.computeVertexNormals();
  
  const roof = new THREE.Mesh(frontGeo, roofMat);
  group.add(roof);
  
  // 檐口板
  const eaveFront = new THREE.Mesh(
    new THREE.BoxGeometry(w + 2 * s, 0.3 * s, 0.8 * s),
    darkMat
  );
  eaveFront.position.set(0, -0.1, -halfD - 0.2 * s);
  group.add(eaveFront);
  
  const eaveBack = eaveFront.clone();
  eaveBack.position.z = halfD + 0.2 * s;
  group.add(eaveBack);
  
  const eaveLeft = new THREE.Mesh(
    new THREE.BoxGeometry(0.8 * s, 0.3 * s, d + 2 * s),
    darkMat
  );
  eaveLeft.position.set(-halfW - 0.2 * s, -0.1, 0);
  group.add(eaveLeft);
  
  const eaveRight = eaveLeft.clone();
  eaveRight.position.x = halfW + 0.2 * s;
  group.add(eaveRight);
  
  return group;
}

function buildMural(s) {
  const muralGroup = new THREE.Group();
  muralGroup.name = 'mural';
  
  // 壁画位置：拱眼壁间
  const muralMat = new THREE.MeshStandardMaterial({
    color: 0x8a3a2a,
    roughness: 0.8,
    emissive: 0x2a1a0a,
    emissiveIntensity: 0.15,

    opacity: 0.7
  });
  
  const baysWidth = 7;

  const totalW = baysWidth * colSpacingW;
  const totalD = 4 * colSpacingD;
  const muralY = 2.2 + 5 * s + 0.5;
  
  // 前后壁画板

    muralBack.position.z = totalD / 2 - 0.3;
    muralBack.rotation.y = Math.PI;
    muralGroup.add(muralBack);

  // 左右壁画板
  for (let j = 0; j < 4; j++) {
    const z = -totalD / 2 + (j + 0.5) * colSpacingD;
    
    const muralLeft = new THREE.Mesh(
      new THREE.PlaneGeometry(colSpacingD * 0.9, 1.5 * s),

  muralGroup.userData = { partKey: 'mural', partName: '唐代壁画' };

function buildAmbientParticles() {
  const particleCount = 80;
  const positions = new Float32Array(particleCount * 3);
  const sizes = new Float32Array(particleCount);
  
  for (let i = 0; i < particleCount; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 60;
    positions[i * 3 + 1] = Math.random() * 30 + 2;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 60;
    sizes[i] = Math.random() * 0.3 + 0.1;
  }
  
  const particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  
  const particleMat = new THREE.PointsMaterial({
    color: 0xc9a96e,
    size: 0.15,
    transparent: true,
    opacity: 0.4,
    sizeAttenuation: true,
    blending: THREE.AdditiveBlending
  });
  
  const particles = new THREE.Points(particleGeo, particleMat);
  particles.userData.isParticle = true;
  scene.add(particles);
}

// ==================== 事件处理 ====================
function setupEvents() {
  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('mousemove', onMouseMove);
  renderer.domElement.addEventListener('click', onClick);
  
  // 按钮
  document.getElementById('btn-rotate').addEventListener('click', toggleRotate);
  document.getElementById('btn-explode').addEventListener('click', toggleExplode);
  document.getElementById('btn-reset').addEventListener('click', resetView);
  document.getElementById('panel-close').addEventListener('click', closePanel);
  
  // 图层选择
  document.querySelectorAll('.layer-btn').forEach(btn => {
    btn.addEventListener('click', () => selectLayer(btn.dataset.layer));
  });
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  
  // 收集可交互对象
  const interactables = [];
  Object.values(parts).forEach(partGroup => {
    partGroup.traverse(child => {
      if (child.isMesh) interactables.push(child);
    });
  });
  
  const intersects = raycaster.intersectObjects(interactables);
  
  const tooltip = document.getElementById('hover-tooltip');
  
  if (intersects.length > 0) {
    // 找到所属的part
    let obj = intersects[0].object;
    let partKey = null;
    let partName = null;
    
    while (obj && !obj.userData.partKey) {
      obj = obj.parent;
    }
    
    if (obj && obj.userData.partKey) {
      partKey = obj.userData.partKey;
      partName = obj.userData.partName;
    }
    
    if (partKey && partName) {
      // 高亮
      if (hoveredObject !== obj) {
        if (hoveredObject) {
          setPartHighlight(hoveredObject, false);
        }
        hoveredObject = obj;
        setPartHighlight(obj, true);
      }
      
      // tooltip
      tooltip.textContent = partName;
      tooltip.style.left = (event.clientX + 15) + 'px';
      tooltip.style.top = (event.clientY + 15) + 'px';
      tooltip.classList.add('visible');
      
      renderer.domElement.style.cursor = 'pointer';
    }
  } else {
    if (hoveredObject) {
      setPartHighlight(hoveredObject, false);
      hoveredObject = null;
    }
    tooltip.classList.remove('visible');
    renderer.domElement.style.cursor = 'grab';
  }
}

function setPartHighlight(partGroup, highlight) {
  partGroup.traverse(child => {
    if (child.isMesh && child.material) {
      if (highlight) {
        if (!child.userData.originalEmissive) {
          child.userData.originalEmissive = child.material.emissive ? child.material.emissive.getHex() : 0;
          child.userData.originalEmissiveIntensity = child.material.emissiveIntensity || 0;
        }
        if (child.material.emissive) {
          child.material.emissive.setHex(0xc9a96e);
          child.material.emissiveIntensity = 0.3;
        }
      } else {
        if (child.userData.originalEmissive !== undefined && child.material.emissive) {
          child.material.emissive.setHex(child.userData.originalEmissive);
          child.material.emissiveIntensity = child.userData.originalEmissiveIntensity;
        }
      }
    }
  });
}

function onClick(event) {
  if (hoveredObject && hoveredObject.userData.partKey) {
    showInfoPanel(hoveredObject.userData.partKey);
  }
}

function showInfoPanel(key) {
  const info = partInfo[key];
  if (!info) return;
  
  document.getElementById('panel-title').textContent = info.title;
  document.getElementById('panel-subtitle').textContent = info.subtitle;
  document.getElementById('panel-body').innerHTML = info.content;
  document.getElementById('info-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('info-panel').classList.remove('open');
}

function toggleRotate() {
  autoRotate = !autoRotate;
  controls.autoRotate = autoRotate;
  controls.autoRotateSpeed = 1.0;
  document.getElementById('btn-rotate').classList.toggle('active', autoRotate);
}

function toggleExplode() {
  exploded = !exploded;
  document.getElementById('btn-explode').classList.toggle('active', exploded);
  
  const targetOffsets = exploded ? explodeOffsets : null;
  const duration = 800;
  const startTime = performance.now();
  
  const startPositions = {};
  Object.keys(parts).forEach(key => {
    startPositions[key] = parts[key].position.clone();
  });
  
  function animateExplode() {
    const elapsed = performance.now() - startTime;
    const t = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3); // easeOutCubic
    
    Object.keys(parts).forEach(key => {
      const part = parts[key];
      const start = startPositions[key];
      
      if (targetOffsets && targetOffsets[key]) {
        part.position.x = start.x + targetOffsets[key].x * eased;
        part.position.y = start.y + targetOffsets[key].y * eased;
        part.position.z = start.z + targetOffsets[key].z * eased;
      } else {
        part.position.x = start.x;
        part.position.y = start.y;
        part.position.z = start.z;
      }
    });
    
    if (t < 1) {
      requestAnimationFrame(animateExplode);
    }
  }
  
  animateExplode();
}

function resetView() {
  // 重置相机
  const startPos = camera.position.clone();
  const startTarget = controls.target.clone();
  const endPos = new THREE.Vector3(35, 20, 35);
  const endTarget = new THREE.Vector3(0, 5, 0);
  
  const duration = 1000;
  const startTime = performance.now();
  
  function animateReset() {
    const elapsed = performance.now() - startTime;
    const t = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    
    camera.position.lerpVectors(startPos, endPos, eased);
    controls.target.lerpVectors(startTarget, endTarget, eased);
    controls.update();
    
    if (t < 1) {
      requestAnimationFrame(animateReset);
    }
  }
  
  animateReset();
  
  // 重置拆解
  if (exploded) {
    toggleExplode();
  }
  
  // 重置图层
  selectLayer('all');
}

function selectLayer(layer) {
  currentLayer = layer;
  
  document.querySelectorAll('.layer-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.layer === layer);
  });
  
  if (layer === 'all') {
    Object.values(parts).forEach(part => {
      setVisibleRecursive(part, true);
    });
  } else {
    Object.keys(parts).forEach(key => {
      const visible = (key === layer);
      setVisibleRecursive(parts[key], visible);
    });
  }
}

function setVisibleRecursive(obj, visible) {
  obj.visible = visible;
  obj.traverse(child => {
    child.visible = visible;
  });
}

// ==================== 加载进度 ====================
function updateLoaderProgress(percent) {
  const bar = document.getElementById('loader-bar');
  if (bar) {
    bar.style.width = percent + '%';
  }
}

// ==================== 动画循环 ====================
function animate() {
  requestAnimationFrame(animate);
  
  const delta = clock.getDelta();
  const elapsed = clock.getElapsedTime();
  
  controls.update();
  
  // 粒子飘动
  scene.traverse(obj => {
    if (obj.userData.isParticle) {
      obj.rotation.y += delta * 0.02;
      const positions = obj.geometry.attributes.position.array;
      for (let i = 1; i < positions.length; i += 3) {
        positions[i] += Math.sin(elapsed + i) * 0.002;
      }
      obj.geometry.attributes.position.needsUpdate = true;
    }
  });
  
  renderer.render(scene, camera);
}

// ==================== 启动 ====================
init();
</script>
<script src="theme.js"></script>
</body>
